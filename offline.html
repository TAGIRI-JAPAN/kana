<script>
/* ==========================================================================
   Shared site layer — used by every page.
   Owns: data loading, language state, nav, storage, the mastery strip.
   Page scripts (app.js, guide.js) call TK.init() and get told when to repaint.
   ========================================================================== */
(function(){
"use strict";

var LEGACY="takane-kana-v3";          /* the drill's old single-purpose key */
var P_KEY="takane:profile";           /* shared across every course */
var K_KEY="takane:kana:stat";         /* this course's per-kana record */

function jget(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* One-time move off the old key so nobody loses their gold. */
function migrate(){
  var old=jget(LEGACY);
  if(!old)return;
  if(!jget(K_KEY))jset(K_KEY,old.stat||{});
  if(!jget(P_KEY))jset(P_KEY,{lang:old.lang||"en",days:old.days||0,lastDay:old.lastDay||""});
  try{localStorage.removeItem(LEGACY);}catch(e){}
}

var TK={
  lang:"en",
  T:null,
  data:{},
  profile:{lang:"en",days:0,lastDay:"",theme:"enji",scheme:"auto",size:"m",today:0},
  stat:{},
  _paint:null,

  t:function(k){return (TK.T[TK.lang]&&TK.T[TK.lang][k])||TK.T.en[k]||"";},
  si:function(){return TK.lang==="si"?"si":"";},

  saveProfile:function(){TK.profile.lang=TK.lang;jset(P_KEY,TK.profile);},

  /* Colour family, brightness and text size are three attributes on <html>;
     every rule in the stylesheet reads from them, so nothing else changes. */
  applyLook:function(){
    var h=document.documentElement;
    h.setAttribute("data-theme",TK.profile.theme||"enji");
    h.setAttribute("data-scheme",TK.profile.scheme||"auto");
    h.setAttribute("data-size",TK.profile.size||"m");
  },
  saveStat:function(){jset(K_KEY,TK.stat);},
  resetStat:function(){TK.stat={};TK.saveStat();},

  /* A day streak costs one string and one compare, and it brings people back. */
  GOAL:20,
  bumpDays:function(){
    var d=new Date(),today=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
    if(TK.profile.lastDay!==today){
      var y=new Date(Date.now()-864e5);
      var yk=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
      TK.profile.days=(TK.profile.lastDay===yk)?TK.profile.days+1:1;
      TK.profile.lastDay=today;TK.profile.today=0;
    }
    TK.profile.today=(TK.profile.today||0)+1;
    TK.saveProfile();TK.drawMastery();
  },

  /* [hiragana, katakana, romaji, sinhala, row, rare?] -> objects + lookups */
  buildKana:function(K){
    function mk(rows,set){return rows.map(function(r){
      return {h:r[0],k:r[1],r:r[2],s:r[3],row:r[4],set:set,rare:!!r[5],id:r[0]};});}
    var all=mk(K.sei,"sei").concat(mk(K.daku,"daku"),mk(K.han,"han"),mk(K.you,"you"));
    var by={h:{},k:{}};all.forEach(function(x){by.h[x.h]=x;by.k[x.k]=x;});
    var look={h:{},k:{}};
    K.look_h.forEach(function(g){g.forEach(function(c){
      if(by.h[c])look.h[c]=(look.h[c]||[]).concat(g.filter(function(x){return x!==c&&by.h[x];}));});});
    K.look_k.forEach(function(g){g.forEach(function(c){
      if(by.k[c])look.k[c]=(look.k[c]||[]).concat(g.filter(function(x){return x!==c&&by.k[x];}));});});
    var snd={};
    K.sound.forEach(function(g){g.forEach(function(r){
      snd[r]=(snd[r]||[]).concat(g.filter(function(x){return x!==r;}));});});
    return {all:all,by:by,look:look,snd:snd,quizable:all.filter(function(x){return !x.rare;}),
      alt:K.alt,conflict:K.conflict,grid:K.grid,heads:K.heads,small:K.small,
      look_h:K.look_h,look_k:K.look_k};
  },

  statOf:function(id){return TK.stat[id]||(TK.stat[id]={c:0,w:0});},

  drawMastery:function(){
    var el=document.getElementById("mCount");if(!el||!TK.kana)return;
    var q=TK.kana.quizable;
    var done=q.filter(function(x){var s=TK.statOf(x.id);return s.c>=3&&s.c>s.w;}).length;
    el.textContent=done+" / "+q.length;
    document.getElementById("mFill").style.width=(done/q.length*100).toFixed(1)+"%";
    var d=document.getElementById("mDays");
    if(d)d.textContent=TK.profile.days>0?(TK.profile.days+" "+TK.t("today")):"";
    /* a small daily target does more for coming back than a total ever does */
    var g=document.getElementById("goal");
    if(g){
      var n=Math.min(TK.profile.today||0,TK.GOAL),pctG=n/TK.GOAL*100;
      var done=n>=TK.GOAL;
      g.querySelector(".ring").className="ring"+(done?" done":"");
      g.querySelector(".ring").style.background=
        "conic-gradient(var(--gold) 0% "+pctG+"%,rgba(255,255,255,.22) "+pctG+"% 100%)";
      g.querySelector(".txt").textContent=done
        ? TK.t("goalDone")
        : TK.t("goalToday")+" "+(TK.profile.today||0)+" / "+TK.GOAL;
    }
  },

  /* every element carrying data-t gets its text, in the current language */
  paintText:function(root){
    var sc=(root||document).querySelectorAll("[data-t]");
    [].forEach.call(sc,function(el){el.textContent=TK.t(el.dataset.t);});
    [].forEach.call(document.querySelectorAll("#langs button"),function(b){
      b.setAttribute("aria-pressed",b.dataset.lang===TK.lang);});
    document.documentElement.lang=TK.lang==="ja"?"ja":(TK.lang==="si"?"si":"en");
    TK.drawMastery();
  },

  /* The settings sheet is shared. Pages drop their own groups into #sheetSlot. */
  buildSheet:function(){
    if(document.getElementById("sheet"))return;
    var bar=document.querySelector(".hbar"),langs=document.getElementById("langs");
    if(bar&&langs){
      /* language buttons and the gear travel together, so the gear can never
         wrap onto a line by itself on a narrow phone */
      var tools=document.createElement("div");
      tools.className="tools";
      langs.parentNode.insertBefore(tools,langs);
      tools.appendChild(langs);
      var b=document.createElement("button");
      b.type="button";b.className="iconbtn";b.id="openSheet";
      b.setAttribute("aria-haspopup","dialog");
      b.setAttribute("aria-label","Settings");
      b.textContent="\u2699";
      tools.appendChild(b);
      b.onclick=function(){TK.openSheet(true);};
    }
    var THEMES=[["enji","#7A1B2E"],["ai","#1F3B63"],["matcha","#2F5D46"],["sumi","#2A2A2C"]];
    var d=document.createElement("div");
    d.className="sheet";d.id="sheet";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");
    d.innerHTML='<div class="veil" data-close></div><div class="panel">'+
      '<h2><span data-t="settings" class="si-swap"></span>'+
      '<button class="ghost" data-close data-t="close"></button></h2>'+
      '<div id="sheetSlot"></div>'+
      '<div class="sgroup"><span class="flabel si-swap" data-t="theme"></span>'+
      '<div class="swrap" id="themeChips">'+THEMES.map(function(x){
        return '<button class="swatch" type="button" data-theme-pick="'+x[0]+'" '+
          'aria-label="'+x[0]+'"><i style="background:'+x[1]+'"></i></button>';}).join("")+'</div></div>'+
      '<div class="sgroup"><span class="flabel si-swap" data-t="brightness"></span>'+
      '<div class="swrap" id="schemeChips">'+["auto","light","dark"].map(function(v){
        return '<button class="chip" type="button" data-scheme-pick="'+v+'" data-k="br_'+v+'"></button>';
      }).join("")+'</div></div>'+
      '<div class="sgroup"><span class="flabel si-swap" data-t="textSize"></span>'+
      '<div class="swrap" id="sizeChips">'+["m","l","xl"].map(function(v){
        return '<button class="chip" type="button" data-size-pick="'+v+'" data-k="ts_'+v+'"></button>';
      }).join("")+'</div></div></div>';
    document.body.appendChild(d);
    d.addEventListener("click",function(e){
      if(e.target.closest("[data-close]")){TK.openSheet(false);return;}
      var t1=e.target.closest("[data-theme-pick]");
      if(t1){TK.profile.theme=t1.dataset.themePick;TK.saveProfile();TK.applyLook();TK.paintLook();return;}
      var t2=e.target.closest("[data-scheme-pick]");
      if(t2){TK.profile.scheme=t2.dataset.schemePick;TK.saveProfile();TK.applyLook();TK.paintLook();return;}
      var t3=e.target.closest("[data-size-pick]");
      if(t3){TK.profile.size=t3.dataset.sizePick;TK.saveProfile();TK.applyLook();TK.paintLook();return;}
    });
    document.addEventListener("keydown",function(e){
      if(e.key==="Escape")TK.openSheet(false);});
  },
  openSheet:function(on){
    var d=document.getElementById("sheet");if(!d)return;
    if(on)d.setAttribute("open","");else d.removeAttribute("open");
    document.body.style.overflow=on?"hidden":"";
  },
  paintLook:function(){
    [].forEach.call(document.querySelectorAll("[data-theme-pick]"),function(b){
      b.setAttribute("aria-pressed",b.dataset.themePick===(TK.profile.theme||"enji"));});
    [].forEach.call(document.querySelectorAll("[data-scheme-pick]"),function(b){
      b.setAttribute("aria-pressed",b.dataset.schemePick===(TK.profile.scheme||"auto"));});
    [].forEach.call(document.querySelectorAll("[data-size-pick]"),function(b){
      b.setAttribute("aria-pressed",b.dataset.sizePick===(TK.profile.size||"m"));});
    [].forEach.call(document.querySelectorAll("#sheet .chip[data-k]"),function(b){
      b.textContent=TK.t(b.dataset.k);b.classList.toggle("si",TK.lang==="si");});
  },

  load:function(names){
    return Promise.all(names.map(function(n){
      if(window.KANA_DATA&&window.KANA_DATA[n])return Promise.resolve(window.KANA_DATA[n]);
      return fetch("data-"+n+".json").then(function(r){
        if(!r.ok)throw new Error(n+" "+r.status);return r.json();});
    })).then(function(list){
      names.forEach(function(n,i){TK.data[n]=list[i];});
      return TK.data;
    });
  },

  /* Page scripts register with TK.page(); site.js then runs one init for the
     document. That keeps script order from mattering, and lets several page
     scripts share one document (which is how the offline build works). */
  _pages:[],
  page:function(opts){
    TK._pages.push(opts||{});
    if(TK._queued)return;
    TK._queued=true;
    var go=function(){
      var data=[],paints=[],starts=[],relangs=[];
      TK._pages.forEach(function(o){
        (o.data||[]).forEach(function(n){if(data.indexOf(n)<0)data.push(n);});
        if(o.paint)paints.push(o.paint);
        if(o.start)starts.push(o.start);
        if(o.relang)relangs.push(o.relang);
      });
      TK.init({
        data:data,
        paint:function(){paints.forEach(function(f){f();});},
        relang:function(){relangs.forEach(function(f){f();});}
      }).then(function(){
        starts.forEach(function(f){f();});
      }).catch(function(err){
        var lang=(navigator.language||"en").slice(0,2);
        var msg=(window.__i18nFallback&&window.__i18nFallback[lang])||window.__i18nFallback.en;
        ["card","guideBody","chartBody"].forEach(function(id){
          var el=document.getElementById(id);
          if(el)el.innerHTML='<p style="padding:20px 4px">'+msg+"</p>";});
        if(window.console)console.error(err);
      });
    };
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",go);
    else setTimeout(go,0);
  },

  /* opts: {data:[names], paint:fn, relang:fn} */
  init:function(opts){
    migrate();
    var prof=jget(P_KEY);
    if(prof){TK.profile=prof;TK.lang=prof.lang||"en";}
    TK.stat=jget(K_KEY)||{};
    TK.applyLook();
    var need=["i18n","kana"].concat(opts.data||[]);
    return TK.load(need).then(function(){
      TK.T=TK.data.i18n;
      TK.kana=TK.buildKana(TK.data.kana);
      TK._paint=opts.paint||function(){};
      var langs=document.getElementById("langs");
      if(langs)langs.onclick=function(e){
        var b=e.target.closest("[data-lang]");if(!b)return;
        TK.lang=b.dataset.lang;TK.saveProfile();
        TK.paintText();TK.paintLook();TK._paint();
        if(opts.relang)opts.relang();
      };
      var here=(location.pathname.split("/").pop()||"index.html").replace(/^$/,"index.html");
      [].forEach.call(document.querySelectorAll("[data-nav][href]"),function(a){
        a.setAttribute("aria-current",a.getAttribute("href")===here?"page":"false");});
      TK.buildSheet();
      TK.paintText();TK.paintLook();TK._paint();
      return TK;
    });
  }
};

window.TK=TK;
})();

</script>
<script>
/* ==========================================================================
   Rules page + printable chart. Both are rendered from data:
   the prose from guide.json, the tables from kana.json — so the look-alike
   list on the page can never drift from the one the drill actually uses.
   ========================================================================== */
(function(){
"use strict";

function esc(s){return String(s).replace(/[&<>]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}

/* ------------------------------------------------------------ rules page */
function renderGuide(){
  var host=document.getElementById("guideBody");
  if(!host)return;
  var secs=TK.data.guide.sections,si=TK.si();

  host.innerHTML=
    '<nav class="toc" aria-label="contents">'+secs.map(function(s,i){
      return '<a href="#'+s.id+'"><b>'+(i+1)+'</b> '+esc(s.title[TK.lang]||s.title.en)+'</a>';
    }).join("")+'<a href="#lookalike"><b>'+(secs.length+1)+'</b> '+TK.t("lookTitle")+'</a></nav>'+
    secs.map(function(s,i){
      var body=(s.body[TK.lang]||s.body.en).map(function(p){
        return '<p class="'+si+'">'+esc(p)+'</p>';}).join("");
      var ex=(s.examples&&s.examples.length)?
        '<div class="exbox"><div class="exlabel '+si+'">'+TK.t("example")+'</div>'+
        s.examples.map(function(e){
          return '<div class="exrow"><span class="exk">'+esc(e.kana)+'</span>'+
            '<span class="exr">'+esc(e.romaji)+'</span>'+
            '<span class="exg">'+esc(e.gloss||"")+'</span></div>';}).join("")+'</div>':"";
      return '<section class="gsec" id="'+s.id+'"><h2><b>'+(i+1)+'</b>'+
        esc(s.title[TK.lang]||s.title.en)+'</h2>'+body+ex+'</section>';
    }).join("")+
    '<section class="gsec" id="lookalike"><h2><b>'+(secs.length+1)+'</b>'+
      TK.t("lookTitle")+'</h2><p class="'+si+'">'+TK.t("lookNote")+'</p>'+
      lookTable()+'</section>'+
    '<p class="gcta"><a class="ghost" href="#" data-goto="drill">'+TK.t("backToDrill")+'</a></p>';
}

/* Built from the same groups the question generator uses, with the same tip
   the drill shows when a learner picks the wrong one of a pair. */
function tipText(chars){
  var T2=TK.data.tips;
  if(!T2)return "";
  for(var i=0;i<T2.kana.length;i++){
    var c=T2.kana[i].chars,hit=0;
    for(var j=0;j<chars.length;j++)if(c.indexOf(chars[j])>=0)hit++;
    if(hit>=2)return T2.kana[i].tip[TK.lang]||T2.kana[i].tip.en;
  }
  return "";
}
function lookTable(){
  var K=TK.data.kana;
  function block(groups,label){
    return '<div class="lookcol"><h3>'+label+'</h3>'+
      groups.map(function(g){
        var tip=tipText(g);
        return '<div class="lookrow">'+g.map(function(c){
          return '<span class="lk">'+c+'</span>';}).join('<i>/</i>')+'</div>'+
          (tip?'<p class="looktip">'+esc(tip)+'</p>':"");
      }).join("")+'</div>';
  }
  return '<div class="lookwrap">'+block(K.look_h,"ひらがな")+block(K.look_k,"カタカナ")+'</div>';
}

/* -------------------------------------------------------- printable chart */
function renderChart(){
  var host=document.getElementById("chartBody");
  if(!host)return;
  var K=TK.kana,by=K.by;

  function cell(ch){
    if(!ch)return '<div class="ccell hole"></div>';
    var x=by.h[ch];
    if(!x)return '<div class="ccell hole"></div>';
    return '<div class="ccell'+(x.rare?" rare":"")+'">'+
      '<div class="ckana">'+x.h+'<em>'+x.k+'</em></div>'+
      '<div class="crom">'+x.r+'</div>'+
      '<div class="csi si">'+x.s+'</div></div>';
  }
  function section(title,rows,cols){
    return '<section class="csec"><h2>'+title+'</h2>'+
      '<div class="cgrid c'+cols+'">'+rows.join("")+'</div></section>';
  }

  var sei=K.grid.map(function(r){return r.map(cell).join("");});
  sei.push(cell("ん")+'<div class="ccell hole"></div><div class="ccell hole"></div>'+
    '<div class="ccell hole"></div><div class="ccell hole"></div>');

  function plain(set){
    return [K.all.filter(function(x){return x.set===set;})
      .map(function(x){return cell(x.h);}).join("")];
  }

  host.innerHTML=
    section(TK.t("st_sei"),sei,5)+
    section(TK.t("st_daku"),plain("daku"),5)+
    section(TK.t("st_han"),plain("han"),5)+
    section(TK.t("st_you"),plain("you"),3);
}

function paint(){renderGuide();renderChart();}

TK.page({data:document.getElementById("guideBody")?["guide","tips"]:[],paint:paint,start:function(){
  var pb=document.getElementById("printBtn");
  if(pb)pb.onclick=function(){window.print();};
}});
})();

</script>
<script>
/* ==========================================================================
   Numbers and time — rules page + practice, on one page.
   Readings are generated from the rules in data-numbers.json, not stored as a
   giant list, so the only thing to correct is an exception table.
   ========================================================================== */
(function(){
"use strict";

var D=null,TIPS=null;           /* data-numbers.json, data-tips.json */
var S={missed:[],mode:"read",len:20,asked:0,right:0,streak:0,ms:0,q:null,locked:false,
       phase:"quiz",t0:0,counter:"tsu"};

function $(s){return document.querySelector(s);}
function t(k){return TK.t(k);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),x=a[i];a[i]=a[j];a[j]=x;}return a;}
function esc(s){return String(s).replace(/[&<>]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function siC(){return TK.si();}

/* ---------------------------------------------------------------- reading */
/* 0-99 */
function under100(n){
  if(n<10)return D.ones[n];
  var tens=Math.floor(n/10),d=n%10;
  return D.tensPrefix[tens]+"じゅう"+(d?D.ones[d]:"");
}
/* 0-9999 */
function under10000(n){
  var out="";
  var th=Math.floor(n/1000),hu=Math.floor(n%1000/100),rest=n%100;
  if(th)out+=D.thousands[th];
  if(hu)out+=D.hundreds[hu];
  if(rest)out+=under100(rest);
  return out;
}
/* the whole range the site teaches */
function numberReading(n){
  if(n===0)return D.ones[0];
  if(n<10000)return under10000(n);
  var man=Math.floor(n/10000),rest=n%10000;
  var head=(man===1)?"いち"+D.man:under10000(man)+D.man;
  return head+(rest?under10000(rest):"");
}

/* counters: rule + exception table, the same shape the verb material uses */
function counterReading(n,key){
  var c=D.counters[key];
  if(c.whole&&c.whole[n])return c.whole[n];
  /* above 99 the last two digits carry the sound change, the rest is plain */
  if(n>=100){
    var lastTwo=n%100;
    return numberReading(n-lastTwo)+(lastTwo?counterReading(lastTwo,key):c.suffix);
  }
  if(n<10)return (c.last&&c.last[n])?c.last[n]:D.ones[n]+c.suffix;
  var d=n%10,tens=Math.floor(n/10);
  if(d===0)return D.tensPrefix[tens]+(c.ten||("じゅう"+c.suffix));
  return D.tensPrefix[tens]+"じゅう"+((c.last&&c.last[d])?c.last[d]:D.ones[d]+c.suffix);
}
function minuteReading(m){
  if(m===0)return "";
  if(m<10)return D.minutesLast[m];
  var d=m%10,tens=Math.floor(m/10);
  if(d===0)return D.tensPrefix[tens]+D.minutesTen;
  return D.tensPrefix[tens]+"じゅう"+D.minutesLast[d];
}
function timeReading(h,m,useHalf){
  var out=D.hours[h];
  if(m===0)return out;
  if(m===30&&useHalf)return out+" "+D.half;
  return out+" "+minuteReading(m);
}
function pad(n){return (n<10?"0":"")+n;}
/* Some values have a second reading that is also correct (4円 よえん / よんえん,
   7人 しちにん / ななにん, 30分 はん / さんじゅっぷん). None of them may appear
   as a wrong answer. */
function alsoOk(n,key){
  var m=D.alsoOk&&D.alsoOk[key];
  return (m&&m[n])?m[n]:[];
}
function banned(n,key){
  return [counterReading(n,key)].concat(alsoOk(n,key));
}

/* --------------------------------------------------------------- the page */
function renderGuide(){
  var host=$("#numGuide");if(!host||!D)return;
  host.innerHTML=D.guide.map(function(s,i){
    var body=(s.body[TK.lang]||s.body.en).map(function(p){
      return '<p>'+esc(p)+'</p>';}).join("");
    var ex=(s.examples||[]).map(function(e){
      return '<div class="exrow"><span class="exr" style="min-width:5em">'+esc(e.num)+'</span>'+
        '<span class="exk" style="min-width:9em">'+esc(e.kana)+'</span>'+
        '<span class="exg">'+esc(e.gloss||"")+'</span></div>';}).join("");
    return '<section class="gsec" id="'+s.id+'"><h2><b>'+(i+1)+'</b>'+
      esc(s.title[TK.lang]||s.title.en)+'</h2>'+body+
      (ex?'<div class="exbox">'+ex+'</div>':"")+'</section>';
  }).join("");
}

/* an SVG clock face — the one thing paper cannot do */
function clockSVG(h,m){
  var hAng=(h%12)*30+m*0.5, mAng=m*6;
  function hand(ang,len,w,col){
    var r=(ang-90)*Math.PI/180;
    return '<line x1="60" y1="60" x2="'+(60+len*Math.cos(r)).toFixed(1)+'" y2="'+
      (60+len*Math.sin(r)).toFixed(1)+'" stroke="'+col+'" stroke-width="'+w+
      '" stroke-linecap="round"/>';
  }
  var ticks="";
  for(var i=0;i<12;i++){
    var a=(i*30-90)*Math.PI/180, big=(i%3===0);
    ticks+='<line x1="'+(60+(big?46:48)*Math.cos(a)).toFixed(1)+'" y1="'+
      (60+(big?46:48)*Math.sin(a)).toFixed(1)+'" x2="'+(60+52*Math.cos(a)).toFixed(1)+
      '" y2="'+(60+52*Math.sin(a)).toFixed(1)+'" stroke="currentColor" stroke-width="'+
      (big?3:1.5)+'" opacity="'+(big?".85":".4")+'"/>';
  }
  return '<svg viewBox="0 0 120 120" class="clock" role="img" aria-label="clock">'+
    '<circle cx="60" cy="60" r="56" fill="none" stroke="currentColor" stroke-width="2" opacity=".25"/>'+
    ticks+hand(hAng,30,5,"currentColor")+hand(mAng,44,3,"currentColor")+
    '<circle cx="60" cy="60" r="3.5" fill="currentColor"/></svg>';
}

/* ------------------------------------------------------------- questions */
var MODES=[["read","nm_read"],["pick","nm_pick"],["clock","nm_clock"],
           ["settime","nm_settime"],["count","nm_count"],["price","nm_price"]];
var LENS=[[20,"len20"],[50,"len50"],[0,"lenInf"]];

function buildChips(){
  $("#numModes").innerHTML=MODES.map(function(m){
    return '<button class="chip" data-nmode="'+m[0]+'" data-k="'+m[1]+'"></button>';}).join("");
  $("#numModes").onclick=function(e){
    var b=e.target.closest("[data-nmode]");if(!b)return;
    S.mode=b.dataset.nmode;start();
    try{if(b.scrollIntoView)b.scrollIntoView({block:"nearest",inline:"nearest"});}catch(err){}
  };
  $("#sheetSlot").innerHTML=
    '<div class="sgroup"><span class="flabel" data-t="lblLen"></span>'+
    '<div class="swrap lane" id="numLens">'+LENS.map(function(m){
      return '<button class="chip" data-nlen="'+m[0]+'" data-k="'+m[1]+'"></button>';}).join("")+
    '</div></div>';
  $("#numLens").onclick=function(e){
    var b=e.target.closest("[data-nlen]");if(!b)return;
    S.len=parseInt(b.dataset.nlen,10);start();};
  $("#numSettings").onclick=function(){TK.openSheet(true);};
  var pb=$("#printBtn");if(pb)pb.onclick=function(){window.print();};
}
function paint(){
  /* paint runs once before start(), and again on every language switch */
  D=D||(TK.data&&TK.data.numbers);
  if(!D||!document.getElementById("numGuide"))return;
  [].forEach.call(document.querySelectorAll("#numModes .chip,#numLens .chip"),function(b){
    b.textContent=t(b.dataset.k);});
  [].forEach.call(document.querySelectorAll("[data-nmode]"),function(b){
    b.setAttribute("aria-pressed",b.dataset.nmode===S.mode);});
  [].forEach.call(document.querySelectorAll("[data-nlen]"),function(b){
    b.setAttribute("aria-pressed",parseInt(b.dataset.nlen,10)===S.len);});
  var m=MODES.filter(function(x){return x[0]===S.mode;})[0];
  var bits=["<b>"+t(m[1])+"</b>",t(LENS.filter(function(x){return x[0]===S.len;})[0][1])];
  if($("#numNow"))$("#numNow").innerHTML=bits.join(" &middot; ");
  renderGuide();
}

function start(){
  S.asked=0;S.right=0;S.streak=0;S.ms=0;S.missed=[];S.phase="quiz";
  paint();updateScore();newQ();
}

function shell(inner){
  var pct=S.len?Math.min(100,S.asked/S.len*100):0;
  $("#numCard").innerHTML=
    '<div class="corner">'+(S.len?(S.asked+1)+" / "+S.len:"Q"+(S.asked+1))+'</div>'+
    (S.len?'<div class="bar"><i style="width:'+pct+'%"></i></div>':"")+
    '<p class="ask" id="nAsk"></p><div class="stage" id="nStage"></div>'+inner+
    '<div class="verdict" id="nVerdict" role="status" aria-live="polite"></div>'+
    '<div id="nExpl"></div>'+
    '<div class="rowbtns">'+
    '<button class="ghost" id="nNext" disabled>'+t("btnNext")+'</button>'+
    '<button class="ghost alt" id="nSkip">'+t("btnSkip")+'</button>'+
    (S.len?'<button class="ghost alt" id="nStop">'+t("btnEnd")+'</button>':"")+'</div>';
  $("#nNext").onclick=newQ;
  $("#nSkip").onclick=doSkip;
  var st=$("#nStop");if(st)st.onclick=result;
}

/* which rule a question turns on, so the explanation can name it */
function ruleForNumber(n){
  if(n>=10000)return "man";
  var hu=Math.floor(n%1000/100),th=Math.floor(n/1000);
  if(hu===3||hu===6||hu===8)return "hyaku";
  if(th===1||th===3||th===8)return "sen";
  if(hu)return "hyaku";
  if(th)return "sen";
  return null;
}
function ruleForTime(h,m){
  if(m===30)return "half";
  if(h===4||h===7||h===9)return "hour";
  if(m)return "minute";
  return "hour";
}

/* wrong answers are built from the mistake the rule predicts, not from noise */
function naiveNumber(n){
  var s=under10000(n);
  return s.replace("さんびゃく","さんひゃく").replace("ろっぴゃく","ろくひゃく")
          .replace("はっぴゃく","はちひゃく").replace("さんぜん","さんせん")
          .replace("はっせん","はちせん");
}
function options(correct,makers,n){
  var out=[correct],guard=0;
  while(out.length<4&&guard++<80){
    var c=pick(makers)();
    if(c&&out.indexOf(c)<0)out.push(c);
  }
  return shuffle(out);
}

function newQ(){
  if(S.len&&S.asked>=S.len){result();return;}
  S.locked=false;
  shell('<div class="opts" id="nOpts"></div>');
  $("#nOpts").onclick=function(e){
    var b=e.target.closest(".opt");if(b&&!S.locked)answer(parseInt(b.dataset.i,10));};
  var ask=$("#nAsk"),stage=$("#nStage");

  if(S.mode==="read"||S.mode==="pick"||S.mode==="price"){
    var big=(S.mode==="price")||Math.random()<.45;
    var n=big?(10+rnd(9990)):(1+rnd(99));
    if(S.mode==="price")n=pick([1,2,3,5,8])*pick([10,100,1000])+rnd(10)*pick([1,10]);
    if(n<1)n=1;
    var correct=(S.mode==="price")?counterReading(n,"en"):numberReading(n);
    var shown=(S.mode==="price")?("¥"+n.toLocaleString("en-US")):n.toLocaleString("en-US");
    var ban=(S.mode==="price")?banned(n%100,"en").concat([correct]):[correct];
    var makers=[
      function(){var v=(S.mode==="price")?naiveNumber(n)+"えん":naiveNumber(n);
                 if(v===correct)return null;
                 /* よんえん is a real way to say 4円, so it cannot be wrong */
                 for(var i=0;i<ban.length;i++)if(v.slice(-ban[i].length)===ban[i])return null;
                 return v;},
      function(){var m=n+pick([-3,-2,-1,1,2,3,10,-10,100,-100]);
                 if(m<1)return null;
                 return (S.mode==="price")?counterReading(m,"en"):numberReading(m);},
      function(){var m=n+pick([1,-1,2,-2,20,-20,1000,-1000]);
                 if(m<1)return null;
                 return (S.mode==="price")?counterReading(m,"en"):numberReading(m);}
    ];
    if(S.mode==="pick"){
      ask.textContent=t("nask_pick");
      stage.innerHTML='<div class="reading">'+correct+'</div>';
      var nums=[shown],g=0;
      while(nums.length<4&&g++<60){
        var m2=n+pick([-3,-2,-1,1,2,3,10,-10,100,-100,1000,-1000]);
        if(m2<1)continue;
        var v2=(S.mode==="price"?"¥":"")+m2.toLocaleString("en-US");
        if(nums.indexOf(v2)<0)nums.push(v2);
      }
      S.q={answer:shown,teach:numberReading(n)+" = "+shown,rule:ruleForNumber(n)};
      render(shuffle(nums),"num");
    }else{
      ask.textContent=t(S.mode==="price"?"nask_price":"nask_read");
      stage.innerHTML='<div class="numbig">'+shown+'</div>';
      S.q={answer:correct,teach:shown+" = "+correct,rule:ruleForNumber(n)};
      render(options(correct,makers,n),"kana");
    }
    S.t0=Date.now();return;
  }

  if(S.mode==="clock"||S.mode==="settime"){
    var FIVE=[0,5,10,15,20,25,30,35,40,45,50,55];
    var h=1+rnd(12);
    var mm=(S.mode==="clock")?pick(FIVE)
      :pick(FIVE.concat([1,3,4,6,7,8,9,12,17,23,38,47,58]));
    var reading=timeReading(h,mm,true);
    var digital=h+":"+pad(mm);
    if(S.mode==="clock"){
      ask.textContent=t("nask_clock");
      stage.innerHTML=clockSVG(h,mm);
      var alts=[reading],g2=0;
      while(alts.length<4&&g2++<80){
        var h2=h,m2b=mm;
        if(Math.random()<.5)h2=1+rnd(12);else m2b=pick(FIVE);
        /* the same clock time must never appear twice — 5:30 can be said as
           both ごじはん and ごじさんじゅっぷん, and both would be right */
        if(h2===h&&m2b===mm)continue;
        var v=timeReading(h2,m2b,Math.random()<.7);
        var other=timeReading(h,mm,!( mm===30));
        if(v===other)continue;
        if(alts.indexOf(v)<0)alts.push(v);
      }
      S.q={answer:reading,teach:digital+" = "+reading,rule:ruleForTime(h,mm)};
      render(shuffle(alts),"kana");
    }else{
      ask.textContent=t("nask_settime");
      stage.innerHTML='<div class="reading">'+reading+'</div>';
      var ds=[digital],g3=0;
      while(ds.length<4&&g3++<80){
        var hh=1+rnd(12),m3=pick(FIVE.concat([1,3,4,6,8]));
        if(hh===h&&m3===mm)continue;
        var v3=hh+":"+pad(m3);
        if(ds.indexOf(v3)<0)ds.push(v3);
      }
      S.q={answer:digital,teach:reading+" = "+digital,rule:ruleForTime(h,mm)};
      render(shuffle(ds),"num");
    }
    S.t0=Date.now();return;
  }

  /* counters */
  var keys=Object.keys(D.counters).filter(function(k){return k!=="en";});
  var key=pick(keys),c=D.counters[key];
  var max=Math.min(c.max,(key==="tsu")?10:((key==="nichi")?31:30));
  var cn=1+rnd(max);
  var cr=counterReading(cn,key);
  ask.textContent=t("nask_count");
  stage.innerHTML='<div class="numbig">'+cn+'<span class="cunit">'+c.jp.replace("〜","")+'</span></div>'+
    '<div class="sub">'+esc(c[TK.lang]||c.en)+'</div>';
  var ban=banned(cn,key);
  var copts=[cr],g4=0;
  while(copts.length<4&&g4++<120){
    var alt=null,r=Math.random();
    if(r<.45)alt=D.ones[cn%10||1]+c.suffix;                 /* the regular guess */
    else if(r<.8)alt=counterReading(1+rnd(max),key);
    else alt=counterReading(cn,pick(keys));
    if(alt&&copts.indexOf(alt)<0&&ban.indexOf(alt)<0)copts.push(alt);
  }
  S.q={answer:cr,teach:cn+c.jp.replace("〜","")+" = "+cr,
       rule:(c.whole&&c.whole[cn])?"counterIrregular":"counter"};
  render(shuffle(copts),"kana");
  S.t0=Date.now();
}

function render(list,cls){
  /* a long reading in a half-width card has to come down a size or it wraps
     in the middle of a word */
  var longest=list.reduce(function(n,o){return Math.max(n,o.length);},0);
  var base=(cls==="kana")?"kana":"numopt";
  var size=(longest>9)?" xlong":(longest>6?" long":"");
  $("#nOpts").innerHTML=list.map(function(o,i){
    return '<button class="opt" data-i="'+i+'"><span class="num">'+(i+1)+'</span>'+
      '<span class="main '+base+size+'">'+esc(o)+'</span></button>';}).join("");
  S.q.list=list;
}
function answer(i){
  if(S.locked||!S.q)return;
  S.q.chosen=S.q.list[i];
  var ok=S.q.list[i]===S.q.answer;
  [].forEach.call(document.querySelectorAll("#nOpts .opt"),function(el,idx){
    el.disabled=true;
    if(S.q.list[idx]===S.q.answer)el.dataset.state="ok";
    else if(idx===i)el.dataset.state="ng";});
  finish(ok);
}
function doSkip(){
  if(S.locked||!S.q)return;
  S.q.chosen=null;
  [].forEach.call(document.querySelectorAll("#nOpts .opt"),function(el,idx){
    el.disabled=true;
    if(S.q.list[idx]===S.q.answer)el.dataset.state="ok";});
  finish(false);
}
function finish(ok){
  S.locked=true;TK.bumpDays();
  S.ms+=Math.min(Date.now()-S.t0,60000);S.asked++;
  if(ok){S.right++;S.streak++;}else S.streak=0;
  var v=$("#nVerdict");
  v.className="verdict "+(ok?"ok":"ng");
  v.innerHTML='<span class="tag">'+(ok?t("ok"):t("ng"))+"</span><b>"+esc(S.q.teach)+"</b>";
  var nb=$("#nNext");if(nb)nb.disabled=false;
  numExpl(ok);
  updateScore();
  if(ok)setTimeout(function(){if(S.locked&&S.phase==="quiz")newQ();},800);
}
/* Name the rule the question turns on. On a miss it is the whole point of the
   question; on a hit it still reinforces why the answer looked odd. */
function numExpl(ok){
  var host=$("#nExpl");if(!host)return;
  var key=S.q.rule;
  if(ok||!key||!TIPS||!TIPS.rules[key]){host.innerHTML="";return;}
  var r=TIPS.rules[key];
  if(S.missed.indexOf(key)<0)S.missed.push(key);
  host.innerHTML='<div class="expl"><span class="lab">'+t("labRule")+'</span>'+
    '<p class="nt">'+esc(r[TK.lang]||r.en)+'</p></div>';
}

function updateScore(){
  $("#nAsked").textContent=S.asked;
  $("#nRate").textContent=S.asked?Math.round(S.right/S.asked*100)+"%":"-";
  var st=$("#nStreak");st.textContent=S.streak;st.classList.toggle("hot",S.streak>=5);
  $("#nSpeed").textContent=S.asked?(S.ms/S.asked/1000).toFixed(1):"-";
}
/* the rules this session actually broke */
function numRecap(){
  if(!S.missed.length||!TIPS)return "";
  return '<div class="recap"><h3>'+t("recapTitle")+'</h3>'+
    S.missed.slice(0,5).map(function(k){
      var r=TIPS.rules[k];
      return '<div class="item"><p style="margin:0">'+esc(r[TK.lang]||r.en)+'</p></div>';
    }).join("")+'</div>';
}
function result(){
  S.phase="result";
  var rate=S.asked?Math.round(S.right/S.asked*100):0,deg=Math.round(rate*3.6);
  var avg=S.asked?(S.ms/S.asked/1000).toFixed(1):"-";
  $("#numCard").innerHTML=
    '<div class="result"><div class="corner">RESULT</div><h2>'+t("resTitle")+'</h2>'+
    '<div class="gauge" style="background:conic-gradient(var(--gold) 0deg '+deg+
    'deg,var(--rule) '+deg+'deg 360deg)"><span>'+rate+'<i>%</i></span></div>'+
    '<p style="margin:12px 0 0;font-size:.85rem;color:var(--ink-soft)">'+S.right+' / '+S.asked+
    ' &nbsp;&middot;&nbsp; '+t("resSpeed")+': '+avg+'s</p>'+
    numRecap()+
    '<div class="rowbtns" style="margin-top:20px;justify-content:center">'+
    '<button class="ghost" id="nAgain">'+t("btnAgain")+'</button></div></div>';
  $("#nAgain").onclick=start;
}

TK.page({data:["numbers","tips"],paint:paint,relang:function(){
  if(!document.getElementById("numCard"))return;
  if(S.phase==="result")result();else newQ();
},start:function(){
  if(!document.getElementById("numCard"))return;
  D=TK.data.numbers;TIPS=TK.data.tips;
  buildChips();paint();updateScore();start();
}});
})();

</script>
<script>
/* ==========================================================================
   Kana drill — question logic for drill.html.
   Content lives in data/*.json; shared plumbing lives in site.js.
   This file contains no Japanese content.
   ========================================================================== */
(function(){
"use strict";

var KANA,BY,QUIZABLE,LOOK,SND,ALT,CONFLICT,GRID,HEADS,SMALL,W,WORDS,SPECIAL,TIPS;

var S={confused:[],mode:"k2r",script:"h",sets:{sei:true,daku:false,han:false,you:false},
  len:20,asked:0,right:0,streak:0,ms:0,q:null,locked:false,phase:"quiz",
  weakOnly:false,t0:0,placed:[]};

function $(s){return document.querySelector(s);}
function t(k){return TK.t(k);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function stat(id){return TK.statOf(id);}
function esc(s){return String(s).replace(/[&<>]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function persist(){TK.saveStat();}
function siC(){return TK.si();}

/* ==========================================================================
   ROMAJI -> KANA
   The same rules a Japanese IME uses, built from the kana table itself so it
   can never disagree with the rest of the site. It handles the three things
   learners actually have to be taught: a doubled consonant makes っ, n before
   a consonant makes ん, and a katakana long vowel is typed as a hyphen.
   ========================================================================== */
var IME=null,IME_REV=null;
var IME_EXTRA={
  "n":"ん","nn":"ん","n'":"ん","wo":"を",
  "di":"ぢ","du":"づ","dzu":"づ",
  "xa":"ぁ","la":"ぁ","xi":"ぃ","li":"ぃ","xu":"ぅ","lu":"ぅ",
  "xe":"ぇ","le":"ぇ","xo":"ぉ","lo":"ぉ",
  "xtu":"っ","ltu":"っ","xtsu":"っ","ltsu":"っ",
  "xya":"ゃ","lya":"ゃ","xyu":"ゅ","lyu":"ゅ","xyo":"ょ","lyo":"ょ",
  "she":"しぇ","che":"ちぇ","je":"じぇ",
  "fa":"ふぁ","fi":"ふぃ","fe":"ふぇ","fo":"ふぉ",
  "wi":"うぃ","we":"うぇ"
};
function buildIME(){
  if(IME)return;
  IME={};
  /* plain table first; rare kana are skipped so ぢ/づ can't steal ji/zu */
  KANA.forEach(function(x){if(!x.rare)IME[x.r]=x.h;});
  KANA.forEach(function(x){if(!x.rare)(ALT[x.r]||[]).forEach(function(a){
    if(!IME[a])IME[a]=x.h;});});
  Object.keys(IME_EXTRA).forEach(function(k){IME[k]=IME_EXTRA[k];});
  /* shortest spelling per kana, for showing what should have been typed */
  IME_REV={};
  Object.keys(IME).forEach(function(k){
    var v=IME[k];
    if(k==="n"||k==="n'")return;
    if(!IME_REV[v]||k.length<IME_REV[v].length)IME_REV[v]=k;});
  IME_REV["ん"]="nn";IME_REV["っ"]="xtu";IME_REV["ー"]="-";
}
function isKata(ch){return ch>="\u30A1"&&ch<="\u30F6";}
function toKata(s){
  return s.replace(/[\u3041-\u3096]/g,function(c){
    return String.fromCharCode(c.charCodeAt(0)+0x60);});
}
var VOWEL="aiueo";
function toKana(src,kata){
  buildIME();
  var s=String(src).toLowerCase().replace(/\s+/g,""),out="",i=0;
  while(i<s.length){
    var c=s[i];
    if(c==="-"){out+="ー";i++;continue;}
    if(c==="n"){
      var nx=s[i+1],nx2=s[i+2];
      if(nx==="'"){out+="ん";i+=2;continue;}
      if(nx==="n"){
        /* "nn" before a vowel is ん + a な-row kana ("konnichiwa" -> こんにちわ);
           anywhere else the pair is just ん ("honn" -> ほん). */
        if(nx2&&(VOWEL.indexOf(nx2)>=0||nx2==="y")){out+="ん";i++;continue;}
        out+="ん";i+=2;continue;
      }
      if(!nx||(VOWEL.indexOf(nx)<0&&nx!=="y")){out+="ん";i++;continue;}
    }
    if(s[i+1]===c&&VOWEL.indexOf(c)<0&&c!=="n"&&/[a-z]/.test(c)){out+="っ";i++;continue;}
    var hit=false;
    for(var len=3;len>=1;len--){
      var chunk=s.substr(i,len);
      if(chunk.length===len&&IME[chunk]){out+=IME[chunk];i+=len;hit=true;break;}
    }
    if(!hit){out+=c;i++;}   /* leave it visible so the learner sees the problem */
  }
  return kata?toKata(out):out;
}
/* what the learner would have to type to produce this word */
function toTyping(word){
  buildIME();
  var c=Array.from(word),out="",i=0;
  function base(ch){return isKata(ch)?String.fromCharCode(ch.charCodeAt(0)-0x60):ch;}
  while(i<c.length){
    var a=base(c[i]),b=c[i+1]?base(c[i+1]):"";
    if(c[i]==="ー"){out+="-";i++;continue;}
    if(a==="っ"){
      var nx=c[i+1]?base(c[i+1]):"";
      var nx2=c[i+2]?base(c[i+2]):"";
      var pair=("ゃゅょ".indexOf(nx2)>=0)?nx+nx2:nx;
      var r=IME_REV[pair]||IME_REV[nx]||"";
      out+=r?r.charAt(0):"";i++;continue;
    }
    if("ゃゅょ".indexOf(b)>=0&&IME_REV[a+b]){out+=IME_REV[a+b];i+=2;continue;}
    out+=IME_REV[a]||a;i++;
  }
  return out;
}

/* ------------------------------------------------------------- controls */
var MODES=[["learn","m_learn"],["gojuon","m_gojuon"],["k2r","m_k2r"],["r2k","m_r2k"],["h2k","m_h2k"],
  ["listen","m_listen"],["type","m_type"],["ime","m_ime"],["spell","m_spell"],["dictation","m_dictation"],
  ["special","m_special"],["word","m_word"]];
var SCRIPTS=[["h","sc_h"],["k","sc_k"],["mix","sc_mix"]];
var SETS=[["sei","st_sei"],["daku","st_daku"],["han","st_han"],["you","st_you"]];
var LENS=[[20,"len20"],[50,"len50"],[-60,"lenTime"],[0,"lenInf"]];
var RANGE_MODES=["learn","k2r","r2k","h2k","listen","type"];
var SCRIPT_MODES=["learn","gojuon","k2r","r2k","listen","type"];
var SPELL_MODES=["spell","dictation"];

function buildChips(){
  /* Only the mode lane stays on the page. Script / range / session live in the
     settings sheet, with the current choice summarised in one line above. */
  $("#sheetSlot").innerHTML=
    '<div class="sgroup"><span class="flabel si-swap" data-t="lblScript"></span>'+
    '<div class="swrap lane" id="scriptChips"></div></div>'+
    '<div class="sgroup"><span class="flabel si-swap" data-t="lblSet"></span>'+
    '<div class="swrap lane" id="setChips"></div></div>'+
    '<div class="sgroup"><span class="flabel si-swap" data-t="lblLen"></span>'+
    '<div class="swrap lane" id="lenChips"></div></div>';
  $("#modeChips").innerHTML=MODES.map(function(m){
    return '<button class="chip '+(m[0]==="learn"?"learn":"")+'" data-mode="'+m[0]+'" data-k="'+m[1]+'"></button>';}).join("");
  $("#scriptChips").innerHTML=SCRIPTS.map(function(m){
    return '<button class="chip" data-script="'+m[0]+'" data-k="'+m[1]+'"></button>';}).join("");
  $("#setChips").innerHTML=SETS.map(function(m){
    return '<button class="chip" data-set="'+m[0]+'" data-k="'+m[1]+'"></button>';}).join("");
  $("#lenChips").innerHTML=LENS.map(function(m){
    return '<button class="chip" data-len="'+m[0]+'" data-k="'+m[1]+'"></button>';}).join("");

  $("#modeChips").onclick=function(e){var b=e.target.closest("[data-mode]");if(!b)return;
    S.mode=b.dataset.mode;S.weakOnly=false;startSession();
    /* keep the tapped chip in view on a phone; older browsers may not have it */
    try{if(b.scrollIntoView)b.scrollIntoView({block:"nearest",inline:"nearest"});}catch(err){}};
  $("#scriptChips").onclick=function(e){var b=e.target.closest("[data-script]");if(!b||b.disabled)return;
    S.script=b.dataset.script;startSession();};
  $("#setChips").onclick=function(e){var b=e.target.closest("[data-set]");if(!b||b.disabled)return;
    S.sets[b.dataset.set]=!S.sets[b.dataset.set];
    if(!Object.keys(S.sets).some(function(k){return S.sets[k];}))S.sets.sei=true;
    startSession();};
  $("#lenChips").onclick=function(e){var b=e.target.closest("[data-len]");if(!b||b.disabled)return;
    S.len=parseInt(b.dataset.len,10);startSession();};
  $("#openSettings").onclick=function(){TK.openSheet(true);};
}

/* the summary line — so the learner can see the setup without opening anything */
function drawNowBar(){
  var mode=MODES.filter(function(m){return m[0]===S.mode;})[0];
  var bits=["<b>"+t(mode[1])+"</b>"];
  if(SCRIPT_MODES.indexOf(S.mode)>=0)
    bits.push(t(SCRIPTS.filter(function(x){return x[0]===S.script;})[0][1]));
  if(RANGE_MODES.indexOf(S.mode)>=0)
    bits.push(SETS.filter(function(g){return S.sets[g[0]];}).map(function(g){return t(g[1]);}).join("・"));
  if(S.mode!=="learn")
    bits.push(t(LENS.filter(function(x){return x[0]===S.len;})[0][1]));
  $("#nowVal").innerHTML=bits.join(" &middot; ");
}

function paint(){
  [].forEach.call(document.querySelectorAll(".chip"),function(b){
    b.textContent=t(b.dataset.k);b.classList.toggle("si",TK.lang==="si");});
  [].forEach.call(document.querySelectorAll("[data-mode]"),function(b){
    b.setAttribute("aria-pressed",b.dataset.mode===S.mode);});
  [].forEach.call(document.querySelectorAll("[data-script]"),function(b){
    b.setAttribute("aria-pressed",b.dataset.script===S.script);
    b.disabled=SCRIPT_MODES.indexOf(S.mode)<0;});
  [].forEach.call(document.querySelectorAll("[data-set]"),function(b){
    b.setAttribute("aria-pressed",!!S.sets[b.dataset.set]);
    b.disabled=RANGE_MODES.indexOf(S.mode)<0;});
  [].forEach.call(document.querySelectorAll("[data-len]"),function(b){
    b.setAttribute("aria-pressed",parseInt(b.dataset.len,10)===S.len);b.disabled=(S.mode==="learn");});
  $("#scoreBox").style.display=(S.mode==="learn")?"none":"";
  drawNowBar();drawMastery();
}
function drawMastery(){TK.drawMastery();}

/* -------------------------------------------------- pool + distractors */
function poolKana(){
  var p=KANA.filter(function(x){return S.sets[x.set]&&!x.rare;});
  if(!p.length)p=KANA.filter(function(x){return x.set==="sei"&&!x.rare;});
  if(S.weakOnly){var w=p.filter(function(x){return stat(x.id).w>0;});if(w.length>=4)return w;}
  return p;
}
function weight(k){var s=stat(k.id);return Math.max(0.5,1+s.w*2.5-Math.min(s.c,4)*0.18);}
function weighted(pool){
  var tot=pool.reduce(function(n,k){return n+weight(k);},0),r=Math.random()*tot;
  for(var i=0;i<pool.length;i++){r-=weight(pool[i]);if(r<=0)return pool[i];}
  return pool[pool.length-1];
}
function scriptFor(){return S.script==="mix"?(Math.random()<.5?"h":"k"):S.script;}
/* を reads "o" in modern Japanese, so を and お must never be options for each other. */
function clashes(ans,c){var g=CONFLICT[ans.id];return !!g&&g.indexOf(c.id)>=0;}

function glyphOptions(pool,ans,ansSc,n){
  var mix=S.script==="mix";
  var out=[],used={},seen={};
  used[ans.id]=1;seen[ans[ansSc]]=1;
  function push(c){
    if(!c||out.length>=n||used[c.id]||clashes(ans,c))return;
    var sc=mix?(Math.random()<.5?"h":"k"):ansSc;
    if(seen[c[sc]])return;
    used[c.id]=1;seen[c[sc]]=1;out.push({glyph:c[sc],kana:c});
  }
  shuffle((LOOK[ansSc][ans[ansSc]]||[]).map(function(ch){return BY[ansSc][ch];})
    .filter(function(x){return x&&pool.indexOf(x)>=0;})).forEach(push);
  shuffle((SND[ans.r]||[]).map(function(r){
    return pool.filter(function(x){return x.r===r;})[0];}).filter(Boolean)).forEach(push);
  shuffle(pool.slice()).forEach(push);
  return shuffle([{glyph:ans[ansSc],kana:ans}].concat(out));
}
function romajiOptions(pool,ans,ansSc,n){
  var out=[],seen={};seen[ans.r]=1;
  function push(c){if(!c||out.length>=n||seen[c.r]||clashes(ans,c))return;seen[c.r]=1;out.push(c);}
  shuffle((LOOK[ansSc][ans[ansSc]]||[]).map(function(ch){return BY[ansSc][ch];})
    .filter(function(x){return x&&pool.indexOf(x)>=0;})).forEach(push);
  shuffle((SND[ans.r]||[]).map(function(r){
    return pool.filter(function(x){return x.r===r;})[0];}).filter(Boolean)).forEach(push);
  shuffle(pool.slice()).forEach(push);
  return shuffle([ans].concat(out));
}

/* ------------------------------------------------------------- session */
var tick=null;
function stopTimer(){if(tick){clearInterval(tick);tick=null;}}
function startTimer(){
  stopTimer();
  S.until=Date.now()+(-S.len)*1000;
  tick=setInterval(function(){
    if(S.phase!=="quiz"){stopTimer();return;}
    var left=Math.max(0,Math.ceil((S.until-Date.now())/1000));
    var el=$("#timer");
    if(el){el.textContent=t("timeUp")+" "+left;el.classList.toggle("low",left<=10);}
    var bar=$("#timeBar");
    if(bar)bar.style.width=(left/(-S.len)*100)+"%";
    if(left<=0){stopTimer();endSession();}
  },250);
}
function startSession(){
  stopTimer();
  S.asked=0;S.right=0;S.streak=0;S.ms=0;S.confused=[];S.phase="quiz";
  paint();updateScore();drawMap();
  if(S.mode==="learn"){renderLearn();return;}
  newQ();
  if(S.len<0)startTimer();
}
function endSession(){
  stopTimer();S.phase="result";persist();
  var weak=Object.keys(TK.stat).filter(function(id){var v=TK.stat[id];return v.w>0&&v.w>=v.c&&BY.h[id];})
    .sort(function(a,b){return TK.stat[b].w-TK.stat[a].w;}).slice(0,12);
  var rate=S.asked?Math.round(S.right/S.asked*100):0;
  var avg=S.asked?(S.ms/S.asked/1000).toFixed(1):"-";
  var deg=Math.round(rate*3.6);
  $("#card").innerHTML=
    '<div class="result"><div class="corner">RESULT</div>'+
    '<h2 class="'+siC()+'">'+t("resTitle")+'</h2>'+
    '<div class="gauge" style="background:conic-gradient(var(--gold) 0deg '+deg+'deg,var(--rule) '+deg+'deg 360deg)">'+
    '<span>'+rate+'<i>%</i></span></div>'+
    '<p style="margin:12px 0 0;font-size:.85rem;color:var(--ink-soft)" class="'+siC()+'">'+
    S.right+' / '+S.asked+' &nbsp;&middot;&nbsp; '+t("resSpeed")+': '+avg+'s</p>'+
    '<p style="margin:18px 0 0;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)" class="'+siC()+'">'+
    (weak.length?t("resWeak"):t("resNone"))+'</p>'+
    '<div class="weaklist" id="weaklist">'+weak.map(function(id){var x=BY.h[id];
      return '<button class="tile act" data-say="'+x.h+'" title="'+x.r+'"><span>'+x.h+'</span></button>';}).join("")+'</div>'+
    recapHTML()+
    '<div class="rowbtns" style="margin-top:20px;justify-content:center">'+
    '<button class="ghost" id="again">'+t("btnAgain")+'</button>'+
    (weak.length>=4?'<button class="ghost alt" id="weak">'+t("btnWeak")+'</button>':"")+
    '<button class="ghost alt" id="reset">'+t("btnReset")+'</button></div></div>';
  $("#again").onclick=function(){S.weakOnly=false;startSession();};
  var wb=$("#weak");if(wb)wb.onclick=function(){S.weakOnly=true;startSession();};
  $("#reset").onclick=doReset;
  $("#weaklist").onclick=function(e){var b=e.target.closest("[data-say]");if(b)speak(b.dataset.say);};
  drawMap();drawMastery();
}
/* the pairs this session actually mixed up, with the same tip shown in the
   moment — a short, personal review list rather than a generic one */
function recapHTML(){
  if(!S.confused.length)return "";
  return '<div class="recap"><h3>'+t("recapTitle")+'</h3>'+
    S.confused.slice(0,6).map(function(c){
      return '<div class="item"><div class="pair">'+
        c.pairs.slice(0,4).map(function(x){return esc(x);}).join('<em>&middot;</em>')+
        '</div><p>'+esc(c.tip[TK.lang]||c.tip.en)+'</p></div>';}).join("")+'</div>';
}
function doReset(){TK.resetStat();S.weakOnly=false;startSession();}

/* ----------------------------------------------------------- questions */
function shell(inner,extraBtns){
  var timed=S.len<0;
  var pct=(S.len>0)?Math.min(100,S.asked/S.len*100):100;
  var corner=timed?'<span class="timer" id="timer"></span>'
    :(S.len?(S.asked+1)+" / "+S.len:"Q"+(S.asked+1));
  $("#card").innerHTML=
    '<div class="corner">'+corner+'</div>'+
    (timed?'<div class="bar"><i id="timeBar" style="width:100%"></i></div>'
      :(S.len?'<div class="bar"><i style="width:'+pct+'%"></i></div>':""))+
    '<p class="ask '+siC()+'" id="ask"></p>'+
    '<div class="stage" id="stage"></div>'+inner+
    '<div class="verdict" id="verdict" role="status" aria-live="polite"></div>'+
    '<div id="explSlot"></div>'+
    '<div class="rowbtns">'+(extraBtns||"")+
    '<button class="ghost" id="next" disabled>'+t("btnNext")+'</button>'+
    '<button class="ghost alt" id="skip">'+t("btnSkip")+'</button>'+
    (S.len?'<button class="ghost alt" id="stop">'+t("btnEnd")+'</button>':"")+'</div>';
  $("#next").onclick=function(){newQ();};
  $("#skip").onclick=doSkip;
  var st=$("#stop");if(st)st.onclick=endSession;
}

/* "I don't know" reveals the answer and counts it wrong, so the kana comes
   back sooner. Better than a coin-flip guess that gets scored as knowledge. */
function doSkip(){
  if(S.locked||!S.q)return;
  if(S.q.list){
    var keyFn=S.q.keyFn,a=S.q.answer;
    [].forEach.call($("#opts").querySelectorAll(".opt"),function(el,idx){
      el.disabled=true;
      if(keyFn(S.q.list[idx])===keyFn(a))el.dataset.state="ok";});
  }
  if(S.q.spell){
    var q=S.q;
    [].forEach.call(document.querySelectorAll("#slots .slot"),function(el,i){
      el.classList.remove("on");el.classList.add("ng");el.removeAttribute("data-p");
      el.textContent=q.target[i];});
    var sb=$("#submit");if(sb)sb.disabled=true;
  }
  if(S.q.ime){
    var ie=$("#typed");ie.value=toTyping(S.q.target);ie.disabled=true;
    paintIme(S.q.target);
    finish(false,S.q.answer);showExpl(S.q.answer);
    return;
  }
  var inp=$("#typed");if(inp){inp.value=S.q.answer.r;inp.dataset.state="ng";inp.disabled=true;}
  S.q.chosen=null;
  finish(false,S.q.answer);
  if(S.q.spell)showExpl(S.q.answer);
}

function newQ(){
  if(S.len>0&&S.asked>=S.len){endSession();return;}
  if(S.len<0&&S.until&&Date.now()>=S.until){endSession();return;}
  S.locked=false;S.placed=[];

  if(S.mode==="ime"){
    shell('<div id="typeBox"><input id="typed" autocomplete="off" autocapitalize="off" '+
      'spellcheck="false" inputmode="latin" aria-label="romaji"></div>'+
      '<div class="imeout" id="imeOut"></div>'+
      '<p class="hint '+siC()+'">'+t("imeHint")+'</p>');
  }else if(S.mode==="type"){
    shell('<div id="typeBox"><input id="typed" autocomplete="off" autocapitalize="off" '+
      'spellcheck="false" inputmode="latin" aria-label="romaji"><button class="ghost" id="check">'+t("btnCheck")+'</button></div>');
  }else if(SPELL_MODES.indexOf(S.mode)>=0){
    shell('<div class="slots" id="slots"></div><div class="bank" id="bank"></div>'+
      '<p class="hint '+siC()+'" id="spellHint"></p>',
      '<button class="ghost" id="submit" disabled>'+t("btnAnswer")+'</button>'+
      '<button class="ghost alt" id="clear">'+t("btnClear")+'</button>');
  }else{
    shell('<div class="opts" id="opts"></div>');
    $("#opts").onclick=function(e){var b=e.target.closest(".opt");
      if(b&&!S.locked)answer(parseInt(b.dataset.i,10));};
  }
  var askEl=$("#ask"),stage=$("#stage");

  if(SPELL_MODES.indexOf(S.mode)>=0){buildSpell(askEl,stage);S.t0=Date.now();return;}
  if(S.mode==="ime"){buildIme(askEl,stage);S.t0=Date.now();return;}
  if(S.mode==="gojuon"){buildGojuon(askEl,stage);S.t0=Date.now();return;}

  if(S.mode==="word"){
    var a=pick(WORDS);
    /* same beat-count first: otherwise the answer can be found by counting */
    var beats=Array.from(a.w).length;
    var same=shuffle(WORDS.filter(function(x){
      return x.r!==a.r&&Array.from(x.w).length===beats;}));
    var rest=shuffle(WORDS.filter(function(x){
      return x.r!==a.r&&Array.from(x.w).length!==beats;}));
    var o=same.concat(rest).slice(0,3);
    askEl.textContent=t("ask_word");
    stage.innerHTML='<div class="glyph small">'+a.w+'</div>';
    S.q={answer:a,kanaId:null,word:a};
    renderOpts(shuffle([a].concat(o)),function(x){return x.r;},"",function(){return "";});
  }
  else if(S.mode==="special"){
    var sp=pick(SPECIAL);
    askEl.textContent=t("ask_special");
    stage.innerHTML='<div class="romacue">'+sp.r+'</div><div class="sub">'+sp.en+
      ' &middot; <span class="si">'+sp.si+'</span></div>';
    var opts=shuffle([{w:sp.w,ok:1}].concat(sp.bad.map(function(b){return {w:b,ok:0};})));
    S.q={answer:opts.filter(function(x){return x.ok;})[0],kanaId:null,special:sp};
    renderOpts(opts,function(x){return x.w;},"word",function(){return "";});
  }
  else{
    var pool=poolKana(),k=weighted(pool),sc=scriptFor();
    if(S.mode==="k2r"){
      askEl.textContent=t("ask_k2r");
      stage.innerHTML='<div class="glyph">'+k[sc]+'</div>';
      S.q={answer:k,kanaId:k.id};
      renderOpts(romajiOptions(pool,k,sc,3),function(x){return x.r;},"",function(x){return x.s;});
    }else if(S.mode==="r2k"){
      askEl.textContent=t("ask_r2k");
      stage.innerHTML='<div class="reading">'+k.r+'</div><div class="sub si">'+k.s+'</div>';
      var list=glyphOptions(pool,k,sc,3);
      S.q={answer:list.filter(function(o){return o.kana.id===k.id;})[0],kanaId:k.id};
      renderOpts(list,function(x){return x.glyph;},"kana",function(){return "";});
    }else if(S.mode==="h2k"){
      var fromH=Math.random()<.5,key=fromH?"k":"h",srcK=fromH?"h":"k";
      askEl.textContent=t(fromH?"ask_h2k_hk":"ask_h2k_kh");
      stage.innerHTML='<div class="glyph">'+k[srcK]+'</div>';
      var out=[],seen={};seen[k[key]]=1;
      var push=function(c){if(!c||out.length>=3||seen[c[key]])return;seen[c[key]]=1;out.push(c);};
      shuffle((LOOK[key][k[key]]||[]).map(function(ch){return BY[key][ch];})
        .filter(function(x){return x&&pool.indexOf(x)>=0;})).forEach(push);
      shuffle(pool.slice()).forEach(push);
      S.q={answer:k,kanaId:k.id};
      renderOpts(shuffle([k].concat(out)),function(x){return x[key];},"kana",function(){return "";});
    }else if(S.mode==="listen"){
      if(!hasVoice()){
        $("#card").innerHTML='<div class="notice"><h3>'+t("noVoiceTitle")+'</h3>'+
          '<p>'+t("noVoiceBody")+'</p></div>';
        return;
      }
      askEl.textContent=t("ask_listen");
      stage.innerHTML='<button class="ghost" id="play">'+t("btnPlay")+'</button>';
      $("#play").onclick=function(){speak(k.h);};
      var l2=glyphOptions(pool,k,sc,3);
      S.q={answer:l2.filter(function(o){return o.kana.id===k.id;})[0],kanaId:k.id};
      /* no romaji under the options here — that would answer the question for them */
      renderOpts(l2,function(x){return x.glyph;},"kana",function(){return "";});
      speak(k.h);
    }else if(S.mode==="type"){
      askEl.textContent=t("ask_type");
      stage.innerHTML='<div class="glyph">'+k[sc]+'</div>';
      S.q={answer:k,kanaId:k.id,typing:true};
      var inp=$("#typed");inp.value="";inp.removeAttribute("data-state");inp.disabled=false;inp.focus();
      $("#check").onclick=checkTyped;
      inp.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();
        if(S.locked)newQ();else checkTyped();}};
    }
  }
  S.t0=Date.now();
}

function renderOpts(list,keyFn,cls,subFn){
  $("#opts").innerHTML=list.map(function(o,i){
    return '<button class="opt" data-i="'+i+'"><span class="num">'+(i+1)+'</span>'+
      '<span class="main '+cls+'">'+esc(keyFn(o))+'</span>'+
      '<span class="si">'+esc(subFn(o)||"")+'</span></button>';}).join("");
  S.q.list=list;S.q.keyFn=keyFn;
}

/* ---- type romaji, watch it become kana ---- */
function buildIme(askEl,stage){
  var a=pick(W),kata=isKata(Array.from(a.w)[0]);
  askEl.textContent=t("ask_ime");
  stage.innerHTML='<div class="glyph small">'+a.w+'</div>'+
    '<div class="sub">'+a.en+' &middot; <span class="si">'+a.si+'</span></div>';
  S.q={answer:a,kanaId:null,ime:true,target:a.w,kata:kata};
  var inp=$("#typed"),outEl=$("#imeOut");
  inp.value="";inp.disabled=false;inp.focus();
  paintIme("");
  inp.oninput=function(){
    if(S.locked)return;
    var kana=toKana(inp.value,kata);
    paintIme(kana);
    /* finishing the word is the answer — no extra button to press */
    if(kana===a.w)finishIme(true,kana);
  };
  inp.onkeydown=function(e){
    if(e.key!=="Enter")return;
    e.preventDefault();
    if(S.locked){newQ();return;}
    finishIme(toKana(inp.value,kata)===a.w,toKana(inp.value,kata));
  };
}
function paintIme(kana){
  var t2=Array.from(S.q.target),got=Array.from(kana),html="";
  for(var i=0;i<Math.max(t2.length,got.length);i++){
    if(i>=got.length){html+='<span class="ic todo">_</span>';continue;}
    var cls=(got[i]===t2[i])?"ok":"ng";
    html+='<span class="ic '+cls+'">'+got[i]+'</span>';
  }
  $("#imeOut").innerHTML=html;
}
function finishIme(ok,kana){
  if(S.locked)return;
  var inp=$("#typed");inp.disabled=true;
  if(!ok)paintIme(kana);
  /* credit every kana in the word, the same way spelling does */
  finish(ok,S.q.answer);
  showExpl(S.q.answer);
}

/* ---- gojuon: fill the missing kana ---- */
/* the whole chart in reading order — あいうえお かきくけこ … わをん */
function flatOrder(){
  var out=[];
  GRID.forEach(function(r){r.forEach(function(c){if(c)out.push(c);});});
  out.push("ん");
  return out;
}
function buildGojuon(askEl,stage){
  var sc=scriptFor(),cells,ansChar,roll=Math.random();
  if(roll<0.45){
    /* a window that crosses row boundaries: あいうえ▢かきく
       This asks for the order of the whole chart, not just one row. */
    var flat=flatOrder(),n=8;
    var st=Math.floor(Math.random()*(flat.length-n+1));
    var win=flat.slice(st,st+n);
    var bi=1+Math.floor(Math.random()*(n-2));   /* never the first or last cell */
    ansChar=win[bi];
    cells=win.map(function(c,i){return {ch:c,blank:i===bi};});
    askEl.textContent=t("ask_seq");
  }else if(roll<0.8){
    var row=pick(GRID.filter(function(r){return r.filter(Boolean).length>=4;}));
    var idxs=row.map(function(c,i){return c?i:-1;}).filter(function(i){return i>=0;});
    var bj=pick(idxs);ansChar=row[bj];
    cells=row.map(function(c,i){return {ch:c,blank:i===bj};});
    askEl.textContent=t("ask_row");
  }else{
    var bk=Math.floor(Math.random()*HEADS.length);ansChar=HEADS[bk];
    cells=HEADS.map(function(c,i){return {ch:c,blank:i===bk};});
    askEl.textContent=t("ask_head");
  }
  var ans=BY.h[ansChar];
  stage.innerHTML='<div class="seq">'+cells.map(function(c){
    return c.blank?'<div class="cell blank">?</div>'
      :(c.ch?'<div class="cell">'+BY.h[c.ch][sc]+'</div>':'<div class="cell gap"></div>');}).join("")+'</div>';
  var pool=KANA.filter(function(x){return x.set==="sei"&&!x.rare;});
  /* anything already on screen is not a real option — the learner can see it */
  var shown={};cells.forEach(function(c){if(c.ch&&c.ch!==ansChar)shown[c.ch]=1;});
  var out=[],seen={};seen[ans[sc]]=1;
  var push=function(c){
    if(!c||out.length>=3||seen[c[sc]]||shown[c.h]||clashes(ans,c))return;
    seen[c[sc]]=1;out.push(c);};
  shuffle((LOOK[sc][ans[sc]]||[]).map(function(ch){return BY[sc][ch];})
    .filter(function(x){return x&&pool.indexOf(x)>=0;})).forEach(push);
  shuffle(pool.slice()).forEach(push);
  S.q={answer:ans,kanaId:ans.id,gojuon:sc};
  renderOpts(shuffle([ans].concat(out)),function(x){return x[sc];},"kana",function(){return "";});
}

/* ---- spell: build the word from a tile bank ---- */
function buildSpell(askEl,stage){
  var a=pick(W),target=Array.from(a.w);
  var heard=(S.mode==="dictation");
  askEl.textContent=t(heard?"ask_dictation":"ask_spell");
  /* dictation hides the spelling cue: the word has to come from the ear */
  stage.innerHTML=heard
    ? '<button class="ghost" id="play">'+t("btnPlay")+'</button>'
    : '<div class="romacue">'+a.r+'</div><div class="sub">'+a.en+
      ' &middot; <span class="si">'+a.si+'</span></div>';
  if(heard){$("#play").onclick=function(){speak(a.w);};speak(a.w);}
  var tset={};target.forEach(function(c){tset[c]=1;});
  var dummies=[],guard=0;
  while(dummies.length<4&&guard++<200){
    var base=pick(target),cand=null,bk=BY.h[base]||BY.k[base];
    if(bk){
      var sc=Math.random()<.5?"h":"k",g=LOOK[sc][bk[sc]];
      if(g&&g.length)cand=pick(g);
      if(!cand)cand=pick(QUIZABLE)[sc];
      if(Math.random()<.35)cand=bk[bk.h===base?"k":"h"];
    }else{cand=pick(Array.from(SMALL));}
    if(cand&&!tset[cand]&&dummies.indexOf(cand)<0)dummies.push(cand);
  }
  var bank=shuffle(target.concat(dummies).map(function(ch,i){return {ch:ch,i:i};}));
  S.q={answer:a,kanaId:null,spell:true,target:target,bank:bank};
  $("#spellHint").textContent="";
  drawSpell();
  $("#bank").onclick=function(e){var b=e.target.closest(".btile");if(!b||S.locked)return;
    S.placed.push(parseInt(b.dataset.i,10));drawSpell();};
  $("#slots").onclick=function(e){var b=e.target.closest("[data-p]");if(!b||S.locked)return;
    S.placed.splice(parseInt(b.dataset.p,10),1);drawSpell();};
  $("#clear").onclick=function(){if(S.locked)return;S.placed=[];drawSpell();};
  $("#submit").onclick=checkSpell;
}
function drawSpell(){
  var q=S.q,n=q.target.length,slots="";
  for(var i=0;i<n;i++){
    var bi=S.placed[i];
    slots+=(bi===undefined)?'<div class="slot"></div>'
      :'<div class="slot on" data-p="'+i+'">'+q.bank.filter(function(b){return b.i===bi;})[0].ch+'</div>';
  }
  $("#slots").innerHTML=slots;
  $("#bank").innerHTML=q.bank.map(function(b){
    return '<button class="btile" data-i="'+b.i+'" data-used="'+
      (S.placed.indexOf(b.i)>=0?1:0)+'">'+b.ch+'</button>';}).join("");
  $("#submit").disabled=S.placed.length!==n;
}
function checkSpell(){
  if(S.locked)return;
  var q=S.q;
  var built=S.placed.map(function(i){return q.bank.filter(function(b){return b.i===i;})[0].ch;});
  var ok=built.join("")===q.answer.w;
  [].forEach.call(document.querySelectorAll("#slots .slot"),function(el,i){
    el.classList.remove("on");
    el.classList.add(built[i]===q.target[i]?"ok":"ng");
    el.removeAttribute("data-p");
    if(!ok)el.textContent=q.target[i];});
  $("#submit").disabled=true;
  finish(ok,q.answer);
  showExpl(q.answer);
}
/* When the learner picks a look-alike, say how to tell the two apart. That is
   the thing they actually needed to know, and it is why the distractor exists. */
function tipFor(x,y){
  if(!TIPS||!x||!y)return null;
  var g=[x.h,x.k],h=[y.h,y.k];
  for(var i=0;i<TIPS.kana.length;i++){
    var c=TIPS.kana[i].chars,hasX=false,hasY=false;
    for(var j=0;j<c.length;j++){
      if(g.indexOf(c[j])>=0)hasX=true;
      if(h.indexOf(c[j])>=0)hasY=true;
    }
    if(hasX&&hasY)return TIPS.kana[i].tip;
  }
  return null;
}
function kanaExpl(ok){
  var host=$("#explSlot");if(!host)return;
  var ans=optKana(S.q.answer),chose=optKana(S.q.chosen);
  var sc=S.q.gojuon||"h";
  if(!ans){host.innerHTML="";return;}
  var tip=(!ok&&chose&&chose.id!==ans.id)?tipFor(ans,chose):null;
  if(tip){
    var key=tip.en,pair=ans[sc]+"\u2194"+chose[sc];
    var hit=null;
    for(var q=0;q<S.confused.length;q++)if(S.confused[q].key===key)hit=S.confused[q];
    if(!hit){hit={key:key,pairs:[],tip:tip};S.confused.push(hit);}
    if(hit.pairs.indexOf(pair)<0)hit.pairs.push(pair);
  }
  if(!tip&&ok){host.innerHTML="";return;}   /* nothing useful to add on a hit */
  var pair="";
  if(tip&&chose){
    pair='<div class="pairrow">'+
      '<span class="ans"><b>'+ans[sc]+'</b><i>'+ans.r+'</i></span>'+
      '<span class="you"><b>'+chose[sc]+'</b><i>'+chose.r+'</i></span></div>';
  }
  var body=tip?(tip[TK.lang]||tip.en)
    :(ans.h+" / "+ans.k+" — "+ans.r);
  host.innerHTML='<div class="expl'+(tip?" compare":"")+'">'+
    '<span class="lab">'+t(tip?"labCompare":"labRule")+'</span>'+pair+
    '<p class="nt">'+esc(body)+'</p></div>';
}

function showExpl(a){
  $("#explSlot").innerHTML='<div class="expl"><div class="hw">'+a.w+'</div>'+
    '<div class="rm">'+a.r+'</div>'+
    '<div class="mn">'+a.en+' &middot; <span class="si">'+a.si+'</span></div>'+
    '<p class="nt '+siC()+'">'+(a.note[TK.lang]||a.note.en)+'</p>'+
    '<div class="rowbtns"><button class="ghost alt" id="sayw">'+t("btnPlay")+'</button></div></div>';
  $("#sayw").onclick=function(){speak(a.w);};
}

/* ----------------------------------------------------------- answering */
function accepted(a){var r=a.r.toLowerCase();return [r].concat(ALT[r]||[]);}
function checkTyped(){
  if(S.locked)return;
  var inp=$("#typed"),val=inp.value.trim().toLowerCase().replace(/\s+/g,"");
  if(!val)return;
  var a=S.q.answer,ok=accepted(a).indexOf(val)>=0;
  inp.dataset.state=ok?"ok":"ng";inp.disabled=true;finish(ok,a);
}
/* the kana object behind an option, whatever shape the mode stores it in */
function optKana(o){
  if(!o)return null;
  if(o.kana)return o.kana;
  if(o.h&&o.k)return o;
  return null;
}
function answer(i){
  if(S.locked||!S.q||!S.q.list)return;
  var list=S.q.list,keyFn=S.q.keyFn,a=S.q.answer;
  if(!list[i])return;
  var ok=keyFn(list[i])===keyFn(a);
  S.q.chosen=list[i];
  [].forEach.call($("#opts").querySelectorAll(".opt"),function(el,idx){
    el.disabled=true;
    if(keyFn(list[idx])===keyFn(a))el.dataset.state="ok";
    else if(idx===i)el.dataset.state="ng";});
  finish(ok,a);
}
function finish(ok,a){
  S.locked=true;TK.bumpDays();
  S.ms+=Math.min(Date.now()-S.t0,60000);
  S.asked++;
  if(ok){S.right++;S.streak++;}else S.streak=0;
  if(S.q.kanaId){var s=stat(S.q.kanaId);if(ok)s.c++;else s.w++;}
  if(S.q.spell||S.q.ime){Array.from(S.q.target).forEach(function(ch){
    var kk=BY.h[ch]||BY.k[ch];
    if(kk&&!kk.rare){var st2=stat(kk.id);if(ok)st2.c++;else st2.w++;}});}
  persist();

  var v=$("#verdict"),detail="",hint="";
  v.className="verdict "+(ok?"ok":"ng");
  if(S.q.spell||S.q.ime){detail="<b>"+a.w+"</b>";}
  else if(S.q.word){detail="<b>"+a.w+"</b> &mdash; "+a.r+" &middot; "+a.en+
    ' &middot; <span class="si">'+a.si+"</span>";}
  else if(S.q.special){var sp=S.q.special;
    detail="<b>"+sp.w+"</b> &mdash; "+sp.r+" &middot; "+sp.en;}
  else{var kk2=a.kana||a;
    detail="<b>"+kk2.h+" / "+kk2.k+"</b> &mdash; "+kk2.r+' &middot; <span class="si">'+kk2.s+"</span>";}
  v.innerHTML='<span class="tag">'+(ok?t("ok"):t("ng"))+"</span>"+
    (ok?"":t("answerIs")+" ")+detail+hint;

  var nb=$("#next");if(nb)nb.disabled=false;
  if(S.q.special){
    var sp2=S.q.special;
    $("#explSlot").innerHTML='<div class="expl"><span class="lab">'+t("labRule")+'</span>'+
      '<p class="nt">'+esc(t(sp2.kind==="t"?"kindT":sp2.kind==="c"?"kindC":"kindN"))+'</p></div>';
  }else if(S.q.kanaId&&!S.q.spell&&!S.q.ime)kanaExpl(ok);
  updateScore();drawMap();drawMastery();
  if(ok&&!S.q.spell&&!S.q.ime&&S.phase==="quiz")setTimeout(function(){
    if(S.locked&&S.phase==="quiz")newQ();},S.mode==="special"?1100:750);
}
function updateScore(){
  $("#sAsked").textContent=S.asked;
  $("#sRate").textContent=S.asked?Math.round(S.right/S.asked*100)+"%":"-";
  var st=$("#sStreak");st.textContent=S.streak;st.classList.toggle("hot",S.streak>=5);
  $("#sSpeed").textContent=S.asked?(S.ms/S.asked/1000).toFixed(1):"-";
}

/* --------------------------------------------------------------- learn */
function renderLearn(){
  var sc=S.script==="k"?"k":"h";
  $("#card").innerHTML=
    '<div class="corner">LEARN</div><p class="ask '+siC()+'">'+t("learnTitle")+'</p>'+
    '<div class="stage" style="min-height:150px"><div class="glyph" id="lg">'+(sc==="k"?"ア":"あ")+'</div>'+
    '<div class="sub" id="ls">a &middot; <span class="si">'+BY.h["あ"].s+'</span></div></div>'+
    SETS.filter(function(g){return S.sets[g[0]];}).map(function(g){
      return '<div class="mapset"><h3 class="'+siC()+'">'+t(g[1])+'</h3>'+
        chartHTML(g[0],sc,true)+'</div>';}).join("")+
    '<p class="hint '+siC()+'" style="text-align:left">'+t("learnHint")+'</p>';
  $("#card").onclick=function(e){
    var b=e.target.closest("[data-id]");if(!b)return;
    var x=BY.h[b.dataset.id];
    $("#lg").textContent=x[sc];
    $("#ls").innerHTML=x.r+' &middot; <span class="si">'+x.s+'</span>';
    speak(x.h);};
}

/* --------------------------------------------------------------- audio */
var jaVoice=null;
function loadVoices(){try{var vs=speechSynthesis.getVoices();
  jaVoice=vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf("ja")===0;})[0]||null;}catch(e){}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function hasVoice(){
  if(!("speechSynthesis" in window))return false;
  loadVoices();
  /* some browsers report an empty list until the first call; treat unknown as
     available so we do not block a device that would have worked */
  try{return !!jaVoice||speechSynthesis.getVoices().length===0;}catch(e){return false;}
}
function speak(text){
  if(!("speechSynthesis" in window)){
    var v=$("#verdict");if(v){v.className="verdict";v.textContent=t("noAudio");}return;}
  loadVoices();
  try{var u=new SpeechSynthesisUtterance(text);
    u.lang="ja-JP";if(jaVoice)u.voice=jaVoice;u.rate=.8;
    speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}

/* ----------------------------------------------------------- kana map */
/* Laid out as the actual gojuon chart: one 行 per line, gaps preserved,
   so the shape on screen matches the chart on the classroom wall. */
function chartHTML(set,sc,interactive){
  var cls=interactive?"tile act":"tile";
  function cell(ch){
    if(!ch)return '<div class="tile hole"></div>';
    var x=BY.h[ch];if(!x)return '<div class="tile hole"></div>';
    var s=stat(x.id),fill=Math.min(s.c,4)/4,weak=(s.w>0&&s.w>=s.c)?1:0;
    return '<'+(interactive?"button":"div")+' class="'+cls+'" data-weak="'+weak+'" '+
      'data-rare="'+(x.rare?1:0)+'" data-id="'+x.h+'" title="'+x.h+" "+x.k+" "+x.r+'">'+
      (fill?'<i style="opacity:'+(fill*.9).toFixed(2)+'"></i>':"")+
      '<span>'+x[sc]+'</span></'+(interactive?"button":"div")+'>';
  }
  if(set==="sei"){
    var rows=GRID.map(function(r){return r.map(cell).join("");});
    rows.push(cell("ん")+'<div class="tile hole"></div><div class="tile hole"></div>'+
      '<div class="tile hole"></div><div class="tile hole"></div>');
    return '<div class="chart c5'+(interactive?" big":"")+'">'+rows.join("")+'</div>';
  }
  var list=KANA.filter(function(x){return x.set===set;});
  var cols=(set==="you")?3:5;
  return '<div class="chart c'+cols+(interactive?" big":"")+'">'+
    list.map(function(x){return cell(x.h);}).join("")+'</div>';
}
function drawMap(){
  $("#mapBody").innerHTML=SETS.filter(function(g){return S.sets[g[0]];}).map(function(g){
    return '<div class="mapset"><h3 class="'+siC()+'">'+t(g[1])+'</h3>'+
      chartHTML(g[0],"h",false)+'</div>';}).join("");
}

/* -------------------------------------------------------------- wiring */
function relang(){
  if(S.phase==="result")endSession();
  else if(S.mode==="learn")renderLearn();
  else newQ();
  drawMap();
}

TK.page({data:["words","tips"],relang:relang,start:function(){
  if(!document.getElementById("card"))return;
  var K=TK.kana;
  KANA=K.all;BY=K.by;QUIZABLE=K.quizable;LOOK=K.look;SND=K.snd;
  ALT=K.alt;CONFLICT=K.conflict;GRID=K.grid;HEADS=K.heads;SMALL=K.small;
  W=TK.data.words.spell;WORDS=TK.data.words.quick;SPECIAL=TK.data.words.special;
  TIPS=TK.data.tips;
  document.addEventListener("keydown",function(e){
    if(S.mode==="learn"||S.mode==="ime"||SPELL_MODES.indexOf(S.mode)>=0||S.phase==="result")return;
    if(document.activeElement&&document.activeElement.id==="typed")return;
    if(e.key>="1"&&e.key<="4")answer(parseInt(e.key,10)-1);
    else if(e.key==="Enter"){e.preventDefault();newQ();}});
  buildChips();paint();updateScore();drawMap();startSession();
}});
})();

</script>
<script>
/* in-page router for the offline build: show one section, hide the rest */
(function(){
  function show(name){
    [].forEach.call(document.querySelectorAll(".page"),function(p){
      p.hidden=(p.dataset.page!==name);});
    [].forEach.call(document.querySelectorAll("[data-goto][data-nav]"),function(a){
      a.setAttribute("aria-current",a.dataset.goto===name?"page":"false");});
    try{window.scrollTo(0,0);}catch(e){}
  }
  document.addEventListener("click",function(e){
    var a=e.target.closest("[data-goto]");
    if(!a)return;
    e.preventDefault();
    show(a.dataset.goto);
  });
  show("index");
})();
</script>
