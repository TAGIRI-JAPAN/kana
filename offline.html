<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Hiragana and katakana study site for Sinhala- and English-speaking learners of Japanese.">
<meta name="theme-color" content="#7A1B2E">
<title>かな学習 — TAKANE-SHIKI KANA STUDY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Noto+Sans+Sinhala:wght@400;600&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   TAKANE-SHIKI KANA DRILL — stylesheet
   Identity: maroon + gold, shared with the printed materials.
   Fonts: BIZ UDPGothic (body) / Zen Kaku Gothic New (kana display).
   ========================================================================== */

/* --------------------------------------------------------------------------
   Colour: one accent family + a shared neutral base. Switching theme swaps
   four variables; switching brightness swaps the base. Everything else in the
   sheet reads from these, so no rule needs to know which theme is active.
   -------------------------------------------------------------------------- */
:root{
  /* default family — えんじ */
  --accent:#7A1B2E; --accent-deep:#4E0E1C; --accent-dk:#B8536A;
  --gold:#C7A247; --gold-lt:#E9D9A9; --gold-dp:#A8842E;

  --maroon:var(--accent); --maroon-deep:var(--accent-deep); --maroon-ink:var(--accent-deep);
  --paper:#FAF5EC; --card:#FFFEFA; --field:#FFFFFF;
  --ink:#22181A; --ink-soft:#6E5C5E;
  --rule:rgba(34,24,26,.12); --rule-2:rgba(34,24,26,.07);
  --ok:#2F6E4E; --ok-bg:#EEF6F1; --ok-tag:#DFF0E7;
  --ng:#A3283C; --ng-bg:#FCF0F2; --ng-tag:#F7DFE4;
  --glow:rgba(199,162,71,.16);
  --shadow:0 1px 2px rgba(20,10,14,.05),0 6px 18px rgba(20,10,14,.06);

  --jp-disp:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Sans",sans-serif;
  --ui:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",system-ui,-apple-system,sans-serif;
  --si:"Noto Sans Sinhala","Iskoola Pota",sans-serif;

  --s1:6px; --s2:10px; --s3:16px; --s4:22px; --s5:30px;
  --tap:46px;
  --gs:1;            /* glyph scale, driven by the text-size setting */
}

html[data-theme="ai"]{
  --accent:#1F3B63; --accent-deep:#101F36; --accent-dk:#6E96C9;
  --gold:#C7A247; --gold-lt:#E6D5A4; --gold-dp:#9E7C29;
  --glow:rgba(110,150,201,.16);
}
html[data-theme="matcha"]{
  --accent:#2F5D46; --accent-deep:#16301F; --accent-dk:#6FB58F;
  --gold:#C79B3E; --gold-lt:#E7D6A6; --gold-dp:#9A7526;
  --glow:rgba(111,181,143,.15);
}
html[data-theme="sumi"]{
  --accent:#2A2A2C; --accent-deep:#141416; --accent-dk:#B9B9BE;
  --gold:#B08635; --gold-lt:#E0CFA4; --gold-dp:#8A6A25;
  --glow:rgba(0,0,0,.07);
}

/* Dark base — one neutral shell, whichever family is on. */
html[data-scheme="dark"]{
  --maroon:var(--accent-dk); --maroon-deep:#0F0C0E; --maroon-ink:#F2E9E6;
  --paper:#161215; --card:#1E191C; --field:#241E22;
  --ink:#F2E9E6; --ink-soft:#AC9EA2;
  --rule:rgba(242,233,230,.14); --rule-2:rgba(242,233,230,.07);
  --ok:#6FC79A; --ok-bg:#16281F; --ok-tag:#1D3A2B;
  --ng:#E88497; --ng-bg:#2C171C; --ng-tag:#3D1F26;
  --glow:rgba(199,162,71,.09);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);
}
@media (prefers-color-scheme:dark){
  html[data-scheme="auto"]{
    --maroon:var(--accent-dk); --maroon-deep:#0F0C0E; --maroon-ink:#F2E9E6;
    --paper:#161215; --card:#1E191C; --field:#241E22;
    --ink:#F2E9E6; --ink-soft:#AC9EA2;
    --rule:rgba(242,233,230,.14); --rule-2:rgba(242,233,230,.07);
    --ok:#6FC79A; --ok-bg:#16281F; --ok-tag:#1D3A2B;
    --ng:#E88497; --ng-bg:#2C171C; --ng-tag:#3D1F26;
    --glow:rgba(199,162,71,.09);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);
  }
}

/* Text size. Glyphs use clamp(), which ignores root font-size, so they get
   an explicit multiplier instead. */
html[data-size="l"]{font-size:110%; --gs:1.06;}
html[data-size="xl"]{font-size:122%; --gs:1.12;}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1100px 460px at 50% -160px,var(--glow),transparent 70%),var(--paper);
  color:var(--ink);font-family:var(--ui);line-height:1.6;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}
/* Sinhala inline inside an English or Japanese page */
.si{font-family:var(--si);font-size:1.04em;line-height:1.7}
/* Whole page in Sinhala: set it once at the root so no element can be missed.
   Kana keeps its own font because every kana rule names --jp-disp explicitly. */
html[lang="si"]{--ui:"Noto Sans Sinhala","Iskoola Pota","BIZ UDPGothic","Hiragino Sans",system-ui,sans-serif}
html[lang="si"] body{line-height:1.8}
html[lang="si"] .flabel,html[lang="si"] .l,html[lang="si"] .mrow,
html[lang="si"] .csec h2,html[lang="si"] .mapset h3{letter-spacing:.04em}
.wrap{max-width:800px;margin:0 auto;padding:0 var(--s3) 72px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
header{background:linear-gradient(168deg,var(--accent) 0%,var(--accent-deep) 100%);color:#FAF5EC}
.hbar{max-width:800px;margin:0 auto;padding:15px var(--s3) 13px;display:flex;align-items:center;
  gap:12px;flex-wrap:wrap}
.mark{font-family:var(--jp-disp);font-weight:700;font-size:1.18rem;line-height:1.2}
.mark small{display:block;font-family:var(--ui);font-weight:400;font-size:.6rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold-lt);margin-top:3px;opacity:.85}
.tools{display:flex;gap:6px;align-items:center;margin-left:auto}
.langs{display:flex;gap:4px}
@media (max-width:430px){.mark small{display:none}}
.langs button{font-size:.78rem;padding:6px 12px;border-radius:999px;cursor:pointer;
  background:transparent;color:var(--gold-lt);border:1px solid rgba(233,217,169,.4)}
.langs button[aria-pressed="true"]{background:var(--gold);color:var(--accent-deep);border-color:var(--gold);font-weight:700}

.mastery{max-width:800px;margin:0 auto;padding:0 var(--s3) 14px;display:flex;align-items:flex-end;gap:0}
.mastery > div:first-child{flex:1;min-width:0}
.mbarwrap{flex:1;min-width:0}
.mrow{display:flex;align-items:baseline;gap:10px;font-size:.62rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold-lt);opacity:.92}
.mrow .days{margin-left:auto;letter-spacing:.06em;text-transform:none;font-size:.72rem;color:#fff;opacity:.75}
.mrow b{font-family:var(--jp-disp);font-size:.95rem;letter-spacing:0;color:#fff;
  font-variant-numeric:tabular-nums}
.mbar{height:6px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:5px}
.mbar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--gold-dp),var(--gold),var(--gold-lt))}

/* ---------- controls ---------- */
.setup{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:8px 0 10px;
  margin-top:18px;box-shadow:var(--shadow);overflow:hidden}
.field{display:flex;align-items:center;gap:var(--s1);padding:8px var(--s3)}
.field + .field{border-top:1px dashed var(--rule)}
.flabel{font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);
  min-width:88px;font-weight:700;flex:none}
/* one horizontal lane per row — 10 modes should not stack three deep on a phone */
.lane{display:flex;gap:var(--s1);overflow-x:auto;scrollbar-width:none;padding:2px 0;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.lane::-webkit-scrollbar{display:none}
.chip{font-size:.82rem;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;
  border:1px solid var(--rule);background:var(--field);color:var(--ink);flex:none;scroll-snap-align:start}
.chip[aria-pressed="true"]{background:var(--maroon);color:#fff;border-color:var(--maroon);
  box-shadow:0 2px 8px rgba(122,27,46,.22)}
.chip:disabled{opacity:.3;cursor:not-allowed}
.chip.learn[aria-pressed="true"]{background:var(--gold);color:var(--accent-deep);border-color:var(--gold-dp)}
.chip:active{transform:translateY(1px)}
.chip:focus-visible,.langs button:focus-visible,.opt:focus-visible,.ghost:focus-visible,
.tile:focus-visible,.btile:focus-visible,.slot:focus-visible,#typed:focus-visible{
  outline:2px solid var(--gold-dp);outline-offset:2px}

/* ---------- question card ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;margin-top:var(--s3);
  padding:var(--s4) var(--s3);position:relative;box-shadow:var(--shadow);overflow:hidden;min-height:240px}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;
  background:linear-gradient(90deg,var(--maroon),var(--gold),var(--gold-lt))}
.corner{position:absolute;top:13px;right:15px;font-size:.6rem;letter-spacing:.14em;color:var(--ink-soft);
  text-transform:uppercase;font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--rule);border-radius:2px;margin:2px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.ask{font-size:.84rem;color:var(--ink-soft);margin:0 0 var(--s2);max-width:86%}
/* the Japanese on this site is 分かち書き — break at the spaces, not inside a word */
.ask,.hint,.sub,.expl .nt,.gsec p,.hero p,.pagehead p,.hcard p,.nowbar .val,.map p.note,footer p{
  word-break:keep-all;overflow-wrap:break-word}
.hint,.ask{text-wrap:balance}
.stage{text-align:center;padding:12px 4px var(--s4);border-bottom:1px solid var(--rule);margin-bottom:var(--s3)}
.glyph{font-family:var(--jp-disp);font-weight:500;line-height:1;font-size:calc(clamp(4.2rem,20vw,6.6rem)*var(--gs));
  color:var(--maroon-ink);letter-spacing:.02em}
.glyph.small{font-size:calc(clamp(2.4rem,10vw,3.2rem)*var(--gs))}
.reading{font-family:var(--jp-disp);font-size:calc(clamp(1.9rem,8vw,2.6rem)*var(--gs));color:var(--maroon-ink);letter-spacing:.04em}
.romacue{font-size:calc(clamp(1.6rem,7vw,2.2rem)*var(--gs));color:var(--maroon-ink);letter-spacing:.22em;font-weight:700}
.sub{margin-top:8px;font-size:1rem;color:var(--ink-soft)}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.opt{cursor:pointer;background:var(--field);border:1px solid var(--rule);border-radius:12px;
  padding:15px 8px;text-align:center;position:relative;min-height:var(--tap);
  box-shadow:0 1px 2px rgba(78,14,28,.04)}
.opt:active{transform:translateY(1px)}
.opt .num{position:absolute;top:6px;left:9px;font-size:.6rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.opt .main{font-size:1.4rem;line-height:1.25;display:block}
.opt .main.kana{font-family:var(--jp-disp);font-size:2rem}
.opt .main.word{font-family:var(--jp-disp);font-size:1.45rem}
.opt .si{display:block;font-size:.86rem;color:var(--ink-soft);margin-top:2px;min-height:1.1em}
.opt[data-state="ok"]{border-color:var(--ok);background:var(--ok-bg);box-shadow:inset 0 0 0 1px var(--ok)}
.opt[data-state="ng"]{border-color:var(--ng);background:var(--ng-bg)}
.opt:disabled{cursor:default}

/* ---------- gojuon fill ---------- */
.seq{display:flex;flex-wrap:wrap;gap:var(--s1);justify-content:center}
.cell{width:clamp(42px,11vw,58px);height:clamp(42px,11vw,58px);border-radius:10px;
  border:1px solid var(--rule);background:var(--field);display:flex;align-items:center;
  justify-content:center;font-family:var(--jp-disp);font-size:clamp(1.3rem,5vw,1.8rem)}
.cell.gap{border:none;background:transparent}
.cell.blank{border:2px dashed var(--maroon);background:var(--ng-bg);color:var(--maroon)}

/* ---------- spell ---------- */
.slots{display:flex;flex-wrap:wrap;gap:var(--s1);justify-content:center;min-height:62px}
.slot{width:clamp(44px,11.5vw,58px);height:clamp(44px,11.5vw,58px);border-radius:10px;
  border:2px dashed var(--rule);background:var(--field);display:flex;align-items:center;
  justify-content:center;font-family:var(--jp-disp);font-size:clamp(1.4rem,5.5vw,1.9rem);
  color:var(--maroon-ink)}
.slot.on{border-style:solid;border-color:var(--gold-dp);cursor:pointer}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.slot.ng{border-style:solid;border-color:var(--ng);background:var(--ng-bg);color:var(--ng)}
.bank{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:var(--s3)}
.btile{width:clamp(46px,12vw,60px);height:clamp(46px,12vw,60px);border-radius:12px;cursor:pointer;
  border:1px solid var(--rule);background:var(--field);font-family:var(--jp-disp);
  font-size:clamp(1.4rem,5.5vw,1.9rem);box-shadow:0 1px 2px rgba(78,14,28,.05)}
.btile:active{transform:translateY(1px)}
.btile[data-used="1"]{opacity:.22;pointer-events:none}
.hint{font-size:.75rem;color:var(--ink-soft);text-align:center;margin:12px 0 0}

/* ---------- explanation ---------- */
.expl{margin-top:var(--s3);border:1px solid var(--rule);border-left:4px solid var(--gold);
  border-radius:0 12px 12px 0;background:var(--field);padding:14px var(--s3)}
.expl .hw{font-family:var(--jp-disp);font-size:1.7rem;color:var(--maroon-ink);line-height:1.2}
.expl .rm{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dp);font-weight:700}
.expl .mn{margin:4px 0 8px;font-size:.95rem}
.expl .nt{font-size:.88rem;color:var(--ink-soft);margin:0}

#typeBox{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#typed{font-size:1.5rem;text-align:center;width:190px;padding:11px 12px;border-radius:12px;
  border:1px solid var(--rule);background:var(--field);color:var(--ink);letter-spacing:.05em}
#typed[data-state="ok"]{border-color:var(--ok);background:var(--ok-bg)}
#typed[data-state="ng"]{border-color:var(--ng);background:var(--ng-bg)}

.verdict{margin-top:14px;min-height:3.1em;font-size:.92rem}
.verdict b{color:var(--maroon-ink)}
.verdict .tag{display:inline-block;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;margin-right:8px;vertical-align:2px;font-weight:700}
.verdict.ok .tag{background:var(--ok-tag);color:var(--ok)}
.verdict.ng .tag{background:var(--ng-tag);color:var(--ng)}
.rowbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ghost{font-size:.86rem;padding:11px 18px;border-radius:999px;cursor:pointer;min-height:var(--tap);
  background:var(--maroon);color:#fff;border:1px solid var(--maroon);box-shadow:0 2px 8px rgba(122,27,46,.2)}
.ghost:active{transform:translateY(1px)}
.ghost.alt{background:var(--field);color:var(--maroon-ink);border-color:var(--rule);box-shadow:none}
.ghost:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

/* ---------- score ---------- */
.score{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:14px;overflow:hidden;margin-top:14px;box-shadow:var(--shadow)}
.score div{background:var(--card);padding:11px 4px;text-align:center}
.score .n{font-family:var(--jp-disp);font-size:1.35rem;line-height:1.1;color:var(--maroon-ink);
  font-variant-numeric:tabular-nums}
.score .n.hot{color:var(--gold-dp)}
.score .l{font-size:.55rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}

/* ---------- result ---------- */
.result{text-align:center}
.result h2{font-family:var(--jp-disp);font-size:1.45rem;margin:2px 0 14px;color:var(--maroon-ink)}
.gauge{width:170px;height:170px;border-radius:50%;margin:0 auto;display:flex;align-items:center;
  justify-content:center;position:relative}
.gauge::after{content:"";position:absolute;inset:13px;border-radius:50%;background:var(--card)}
.gauge span{position:relative;z-index:1;font-family:var(--jp-disp);font-size:2.7rem;line-height:1;
  color:var(--maroon-ink);font-variant-numeric:tabular-nums}
.gauge span i{font-size:1.1rem;font-style:normal}
.weaklist{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;justify-content:center}

/* ---------- kana map: laid out as the real gojuon chart ---------- */
.map{margin-top:var(--s5)}
.map h2{font-family:var(--jp-disp);font-size:1.02rem;margin:0 0 3px;color:var(--maroon-ink)}
.map p.note{font-size:.78rem;color:var(--ink-soft);margin:0 0 12px}
.mapset{margin-bottom:var(--s4)}
.mapset h3{font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);
  margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--rule);font-weight:700}
.chart{display:grid;gap:5px;justify-content:start}
.chart.c5{grid-template-columns:repeat(5,auto)}
.chart.c3{grid-template-columns:repeat(3,auto)}
.tiles{display:flex;flex-wrap:wrap;gap:5px}
.tile{width:38px;height:38px;border-radius:9px;border:1px solid var(--rule);background:var(--field);
  display:flex;align-items:center;justify-content:center;font-family:var(--jp-disp);font-size:1.15rem;
  color:var(--ink);position:relative;padding:0;cursor:default;font-weight:500}
.tile.act{cursor:pointer;min-width:38px}
.tile.hole{border:none;background:transparent}
.tile[data-weak="1"]{border-color:var(--ng);color:var(--ng)}
.tile[data-rare="1"]{opacity:.4}
.tile i{position:absolute;inset:0;border-radius:8px;
  background:linear-gradient(160deg,var(--gold-lt),var(--gold));z-index:0}
.tile span{position:relative;z-index:1}
.tiles.big .tile{width:56px;height:56px;font-size:1.5rem}
/* The learn chart must fit five columns inside the card on a 360px phone,
   so the cells share the row rather than carrying a fixed width. */
.chart.c5.big{grid-template-columns:repeat(5,minmax(0,1fr));max-width:330px}
.chart.c3.big{grid-template-columns:repeat(3,minmax(0,1fr));max-width:200px}
.chart.big .tile{width:auto;height:auto;aspect-ratio:1;font-size:calc(clamp(1.15rem,4.4vw,1.5rem)*var(--gs))}

footer{margin-top:var(--s5);padding-top:14px;border-top:1px solid var(--rule);
  font-size:.75rem;color:var(--ink-soft)}
footer p{margin:.5em 0}

@media (min-width:560px){.opts{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){
  .stage,.expl{animation:rise .2s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
  .bar i,.mbar i{transition:width .35s ease}
  .chip,.opt,.ghost,.btile,.tile{transition:transform .08s ease,background .12s ease,border-color .12s ease}
  .opt[data-state="ok"]{animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
}

/* ==========================================================================
   Site chrome — nav, home, rules page, printable chart
   ========================================================================== */

.nav{display:flex;gap:2px;flex:1 1 100%;order:3;overflow-x:auto;scrollbar-width:none;margin:2px -4px -2px}
.nav::-webkit-scrollbar{display:none}
.nav a{color:var(--gold-lt);text-decoration:none;font-size:.8rem;padding:7px 12px;border-radius:999px;
  white-space:nowrap;opacity:.8}
.nav a[aria-current="page"]{background:rgba(255,255,255,.13);color:#fff;opacity:1;font-weight:700}
a.mark{color:inherit;text-decoration:none}
@media (min-width:640px){.nav{flex:0 1 auto;order:0;margin:0}}

/* ---------- home ---------- */
.hero{padding:var(--s5) 0 var(--s4)}
.hero h1{font-family:var(--jp-disp);font-size:clamp(1.5rem,6vw,2.1rem);line-height:1.35;
  margin:0 0 var(--s2);color:var(--maroon-ink)}
.hero p{margin:0;color:var(--ink-soft);max-width:48ch}
.cards{display:grid;gap:var(--s2)}
@media (min-width:660px){.cards{grid-template-columns:repeat(3,1fr)}}
.hcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--rule);
  border-radius:16px;padding:var(--s4) var(--s3);text-decoration:none;color:inherit;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.hcard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;
  background:linear-gradient(90deg,var(--maroon),var(--gold))}
.hcard .n{font-family:var(--jp-disp);font-size:2.4rem;line-height:1;color:var(--gold-dp);margin-bottom:var(--s2)}
.hcard h2{font-family:var(--jp-disp);font-size:1.05rem;margin:0 0 6px;color:var(--maroon-ink)}
.hcard p{margin:0 0 var(--s3);font-size:.85rem;color:var(--ink-soft);flex:1}
.hcard .go{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--maroon-ink);font-weight:700}
.hcard:active{transform:translateY(1px)}

/* ---------- rules page ---------- */
.pagehead{padding:var(--s5) 0 var(--s3)}
.pagehead h1{font-family:var(--jp-disp);font-size:clamp(1.4rem,5.5vw,1.9rem);margin:0 0 8px;color:var(--maroon-ink)}
.pagehead p{margin:0;color:var(--ink-soft);max-width:52ch}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--s5)}
.toc a{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;text-decoration:none;
  padding:7px 13px;border-radius:999px;border:1px solid var(--rule);background:var(--card);color:var(--ink)}
.toc a b{color:var(--gold-dp);font-variant-numeric:tabular-nums}
.gsec{margin-bottom:var(--s5);scroll-margin-top:16px}
.gsec h2{font-family:var(--jp-disp);font-size:1.12rem;color:var(--maroon-ink);margin:0 0 var(--s2);
  display:flex;align-items:baseline;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--gold)}
.gsec h2 b{font-size:.8rem;color:var(--gold-dp);font-variant-numeric:tabular-nums}
.gsec p{margin:0 0 .8em;max-width:62ch}
.exbox{border-left:4px solid var(--gold);background:var(--card);border:1px solid var(--rule);
  border-left-width:4px;border-radius:0 12px 12px 0;padding:12px var(--s3);margin-top:var(--s3)}
.exlabel{font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);
  font-weight:700;margin-bottom:8px}
.exrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:5px 0}
.exrow + .exrow{border-top:1px dashed var(--rule)}
.exk{font-family:var(--jp-disp);font-size:1.3rem;color:var(--maroon-ink);min-width:7em}
.exr{font-size:.85rem;color:var(--gold-dp);font-weight:700;min-width:7em}
.exg{font-size:.82rem;color:var(--ink-soft)}
.lookwrap{display:grid;gap:var(--s3);margin-top:var(--s3)}
@media (min-width:620px){.lookwrap{grid-template-columns:1fr 1fr}}
.lookcol{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px var(--s3)}
.lookcol h3{font-family:var(--jp-disp);font-size:.9rem;margin:0 0 8px;color:var(--maroon-ink);
  padding-bottom:6px;border-bottom:1px solid var(--rule)}
.lookrow{display:flex;flex-wrap:wrap;align-items:center;gap:3px;padding:5px 0;font-family:var(--jp-disp)}
.lookrow i{color:var(--rule);font-style:normal;font-size:.8rem}
.lk{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;
  border-radius:8px;background:var(--field);border:1px solid var(--rule);font-size:1.15rem}
.gcta{margin:var(--s5) 0 0}
.gcta .ghost{display:inline-block;text-decoration:none}

/* ---------- printable chart ---------- */
.csec{margin-bottom:var(--s4);break-inside:avoid}
.csec h2{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);
  font-weight:700;margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
.cgrid{display:grid;gap:5px;justify-content:start}
.cgrid.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.cgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ccell{border:1px solid var(--rule);border-radius:10px;background:var(--card);padding:7px 4px;
  text-align:center;min-width:0}
.ccell.hole{border:none;background:transparent}
.ccell.rare{opacity:.45}
.ckana{font-family:var(--jp-disp);font-size:1.5rem;line-height:1.15;color:var(--maroon-ink)}
.ckana em{font-style:normal;font-size:1.05rem;color:var(--ink-soft);margin-left:5px}
.crom{font-size:.7rem;color:var(--gold-dp);font-weight:700;letter-spacing:.04em}
.csi{font-size:.78rem;color:var(--ink-soft);line-height:1.4}

.printhint{font-size:.75rem;color:var(--ink-soft);align-self:center}
.printonly{display:none}

/* --------------------------------------------------------------------------
   Print / save as PDF. Only the reference material prints: the chart, the kana
   rules and the number rules. The practice is interactive and has no meaning
   on paper, so it is left out entirely.
   -------------------------------------------------------------------------- */
@media print{
  header,.mastery,.goal,.nav,.langs,.tools,footer,
  .rowbtns,.printhint,.sheet,.setup,.nowbar,.modebar,
  .numsec,#card,.score,.map,.hero,.cards,.toc,.gcta{display:none!important}
  .printonly{display:block}
  body{background:#fff;color:#000;font-size:10.5pt;line-height:1.6}
  .wrap{max-width:none;padding:0}
  .pagehead{padding:0 0 6mm}
  .pagehead h1{color:#000;font-size:16pt;margin:0 0 2mm}
  .pagehead p{color:#333;font-size:9.5pt;max-width:none}
  .printfoot{position:running(foot)}
  /* kana chart — a CSS grid will not split across printed pages in Chromium,
     so for print the cells are laid out inline and the table flows normally */
  .cgrid{display:block!important;font-size:0;margin:0 -1.5mm}
  .ccell{display:inline-block;vertical-align:top;width:calc(20% - 3.2mm);
    margin:0 1.5mm 3mm;font-size:10.5pt;border-color:#bbb;background:#fff;break-inside:avoid}
  .cgrid.c3 .ccell{width:calc(33.33% - 3.2mm)}
  .ccell.hole{visibility:hidden}
  .ckana,.crom{color:#000}
  .csi{color:#333}
  .csec{margin-bottom:6mm;break-inside:auto}
  .cgrid{break-inside:auto}
  .csec h2{color:#000;border-color:#999;font-size:8pt}
  /* rules pages */
  .gsec{margin-bottom:7mm}
  .gsec h2{color:#000;border-bottom:1.5pt solid #999;font-size:12pt;padding-bottom:2mm;
    break-after:avoid}
  .gsec h2 b{color:#666}
  .gsec p{color:#000;max-width:none;margin:0 0 2mm}
  .exbox{background:#fafafa;border:1pt solid #ccc;border-left:3pt solid #999;
    break-inside:avoid;padding:3mm 4mm}
  .exk,.exr{color:#000}
  .exg{color:#444}
  .lookwrap{display:block}
  .lookcol{border:1pt solid #ccc;background:#fff;break-inside:avoid;margin-bottom:4mm}
  .lookcol h3{color:#000}
  .lk{border-color:#999;background:#fff}
  .looktip{color:#333}
  @page{margin:14mm 12mm}
}

</style>

jyo"]},"grid":[["あ","い","う","え","お"],["か","き","く","け","こ"],["さ","し","す","せ","そ"],["た","ち","つ","て","と"],["な","に","ぬ","ね","の"],["は","ひ","ふ","へ","ほ"],["ま","み","む","め","も"],["や","","ゆ","","よ"],["ら","り","る","れ","ろ"],["わ","","","","を"]],"heads":["あ","か","さ","た","な","は","ま","や","ら","わ"],"small":"ゃゅょャュョっッーぁぃぅぇぉァィゥェォ","conflict":{"を":["お"],"お":["を"]}},"words":{"spell":[{"w":"ふじさん","r":"FUJISAN","en":"Mt. Fuji","si":"ෆුජි කන්ද","note":{"en":"Japan's highest mountain, 3,776 m, on the border of Shizuoka and Yamanashi. A World Heritage site since 2013. The climbing season is only July to early September.","ja":"日本で いちばん たかい 山です。3,776メートル。しずおかけんと やまなしけんの あいだに あります。2013年に 世界遺産に なりました。のぼれるのは 7月から 9月はじめだけです。","si":"ජපානයේ උසම කන්ද — මීටර් 3,776. ෂිසුඕකා සහ යමනාෂි අතර. 2013 සිට ලෝක උරුමයක්. නැගීමට හැක්කේ ජූලි සිට සැප්තැම්බර් මුල දක්වා පමණයි."}},{"w":"とうきょう","r":"TOUKYOU","en":"Tokyo","si":"ටෝකියෝ","note":{"en":"The capital of Japan. English writes it Tokyo, but the kana needs both う: to-u-kyo-u, four beats. Writing ときょ is a common mistake.","ja":"日本の しゅとです。えいごでは Tokyo ですが、かなでは 「う」が 2つ 入ります。「と・う・きょ・う」で 4はく。「ときょ」は まちがいです。","si":"ජපානයේ අගනුවර. ඉංග්‍රීසියෙන් Tokyo ලෙස ලියුවත්, කනා වලට う දෙකම ඕනේ: to-u-kyo-u, බීට් හතරයි. ときょ ලෙස ලිවීම බහුල වැරැද්දක්."}},{"w":"さくら","r":"SAKURA","en":"cherry blossom","si":"සකුරා මල","note":{"en":"Cherry blossom. It blooms for about a week between late March and April. People sit under the trees for hanami — flower viewing.","ja":"さくらの 花です。3月の おわりから 4月に 1しゅうかんぐらい さきます。木の したで 「はなみ」を します。","si":"සකුරා මල. මාර්තු අගදී සිට අප්‍රේල් දක්වා සතියක් පමණ පිපෙනවා. මිනිස්සු ගස් යට වාඩිවෙලා 'හනාමි' කරනවා."}},{"w":"おんせん","r":"ONSEN","en":"hot spring","si":"උණු දිය උල්පත","note":{"en":"A natural hot spring bath. You wash your body fully before getting in, and you do not put your towel in the water. Some onsen still refuse guests with tattoos.","ja":"しぜんの おふろです。入る まえに からだを ぜんぶ あらいます。タオルは おゆに 入れません。いれずみが ある人は 入れない ところも あります。","si":"ස්වාභාවික උණු දිය නාන තැනක්. ඇතුළු වීමට පෙර සිරුර සම්පූර්ණයෙන් සෝදනවා. තුවාය වතුරට දමන්නේ නැහැ. පච්ච තියෙන අයට ඇතුළු වීම තහනම් තැන් තිබෙනවා."}},{"w":"しんかんせん","r":"SHINKANSEN","en":"bullet train","si":"අධිවේගී දුම්රිය","note":{"en":"The high-speed train. Tokyo to Osaka takes about two and a half hours. Reserved and non-reserved cars are separate, so check your ticket.","ja":"はやい でんしゃです。とうきょうから おおさかまで 2じかん半ぐらいです。していせきと じゆうせきが あるので きっぷを よく みてください。","si":"අධිවේගී දුම්රිය. ටෝකියෝ සිට ඕසාකා දක්වා පැය දෙකහමාරක් පමණ. වෙන් කළ සහ නොවෙන් කළ මැදිරි වෙන් වෙන් නිසා ටිකට් එක බලන්න."}},{"w":"コンビニ","r":"KONBINI","en":"convenience store","si":"පහසු වෙළඳසැල","note":{"en":"A 24-hour convenience store. You can pay bills, print documents, send parcels and withdraw cash there, not just buy food.","ja":"24じかん あいている みせです。ものを かうだけでなく、りょうきんの しはらい、いんさつ、たくはい、ATMも つかえます。","si":"පැය 24ම විවෘත වෙළඳසැලක්. කෑම ගන්නවා විතරක් නෙවෙයි - බිල් ගෙවීම, මුද්‍රණය, පාර්සල් යැවීම, ATM එකත් තියෙනවා."}},{"w":"ヘルメット","r":"HERUMETTO","en":"helmet","si":"හිස්වැසුම","note":{"en":"Helmet. On a Japanese construction or factory site it is required, not optional. Note the small ッ — the sound stops for one beat.","ja":"ヘルメットです。こうじげんばや こうじょうでは かならず かぶります。小さい「ッ」に ちゅういしてください。1はく とまります。","si":"හිස්වැසුම. ජපානයේ ඉදිකිරීම් හෝ කර්මාන්තශාලා බිමක එය අනිවාර්යයි. කුඩා ッ එකට සැලකිලිමත් වන්න - බීට් එකක් නවතිනවා."}},{"w":"あんぜん","r":"ANZEN","en":"safety","si":"ආරක්ෂාව","note":{"en":"Safety. You will hear it every day at work: 安全第一 (anzen dai-ichi) means safety first. Learn it before your first shift.","ja":"「あんぜん」です。しょくばで まいにち ききます。「安全第一（あんぜんだいいち）」＝ safety first。はたらく まえに おぼえましょう。","si":"ආරක්ෂාව. රැකියා ස්ථානයේ දිනපතා අහන්න ලැබෙනවා. 安全第一 (anzen dai-ichi) = ආරක්ෂාව පළමුව. වැඩට යන්න කලින් මතක තියාගන්න."}},{"w":"きゅうけい","r":"KYUUKEI","en":"break / rest","si":"විවේකය","note":{"en":"A work break. Ask 休憩してもいいですか (kyuukei shite mo ii desu ka). きゅ is one beat and きゅう is two — four beats in total: kyu-u-ke-i.","ja":"やすみ じかんです。「きゅうけい しても いいですか」と ききます。「きゅ」は 1はく、「きゅう」は 2はくです。","si":"වැඩ විවේකය. 休憩してもいいですか කියලා අහන්න පුළුවන්. きゅ එක බීට් එකයි; きゅう බීට් දෙකයි."}},{"w":"ざんぎょう","r":"ZANGYOU","en":"overtime","si":"අතිකාල","note":{"en":"Overtime work. By law it must be paid at a higher rate. If you are asked to do it often without extra pay, that is a problem worth raising.","ja":"じかんがいの しごとです。ほうりつで わりましの きゅうりょうが ひつようです。はらわれない ばあいは そうだんして ください。","si":"අතිකාල වැඩ. නීතියෙන් වැඩි ගෙවීමක් ලැබිය යුතුයි. නොගෙවා නිතර කරන්න කියනවා නම්, ඒක කතා කළ යුතු කරුණක්."}},{"w":"せんぱい","r":"SENPAI","en":"senior colleague","si":"ජ්‍යෙෂ්ඨ සගයා","note":{"en":"Someone who joined before you. In a Japanese workplace the senpai teaches you the job, so asking them questions early is expected, not rude.","ja":"じぶんより さきに 入った 人です。しごとを おしえて くれます。はやく しつもん するのは しつれいでは ありません。","si":"ඔබට කලින් ආපු කෙනා. ජපන් රැකියා ස්ථානයක සෙන්පායි වැඩ උගන්වනවා. ඉක්මනින් ප්‍රශ්න ඇහීම අගෞරවයක් නෙවෙයි."}},{"w":"すみません","r":"SUMIMASEN","en":"excuse me / sorry / thank you","si":"සමාවෙන්න","note":{"en":"The most useful word in Japan. It works as sorry, excuse me, and thank you depending on the situation. When unsure, this is a safe choice.","ja":"日本で いちばん つかう ことばです。あやまる とき、よびかける とき、おれいを いう ときに つかえます。","si":"ජපානයේ වැඩිම ප්‍රයෝජනවත් වචනය. සමාව, 'මට අහන්න පුළුවන්ද', ස්තූතියි - තුනටම වැඩ කරනවා."}},{"w":"おつかれさま","r":"OTSUKARESAMA","en":"thanks for your work","si":"මහන්සි වුණාට ස්තූතියි","note":{"en":"Said when someone finishes work or leaves for the day. There is no English equivalent — treat it as the standard goodbye at work.","ja":"しごとが おわった 人に いいます。えいごに ぴったりの ことばは ありません。しょくばの 「さようなら」だと おもって ください。","si":"වැඩ ඉවර වුණාම හෝ යනකොට කියනවා. ඉංග්‍රීසියේ හරියටම වචනයක් නැහැ. රැකියා ස්ථානයේ 'ගිහින් එන්නම්' කියලා හිතන්න."}},{"w":"べんとう","r":"BENTOU","en":"boxed lunch","si":"දිවා ආහාර පෙට්ටිය","note":{"en":"A packed lunch box. Convenience stores and station shops sell them, and many workplaces have a microwave to heat them.","ja":"おべんとうです。コンビニや えきで かえます。しょくばに でんしレンジが ある ところも おおいです。","si":"දිවා ආහාර පෙට්ටිය. පහසු වෙළඳසැල් සහ දුම්රියපොළවල විකුණනවා. බොහෝ රැකියා ස්ථානවල රත් කරන්න මයික්‍රෝවේව් තියෙනවා."}},{"w":"スリランカ","r":"SURIRANKA","en":"Sri Lanka","si":"ශ්‍රී ලංකාව","note":{"en":"Your own country, written in katakana. Country names always use katakana, so this is a good first katakana word to master.","ja":"あなたの くにです。くにの なまえは カタカナで かきます。さいしょに おぼえると べんりです。","si":"ඔබේ රට, කටකනා වලින්. රටවල නම් හැම විටම කටකනා වලින් ලියනවා. පළමුව මතක තියාගන්න හොඳ වචනයක්."}},{"w":"コロンボ","r":"KORONBO","en":"Colombo","si":"කොළඹ","note":{"en":"Colombo in katakana. The l becomes ロ — Japanese has no l, so every l turns into the ら-row. The mb becomes ンボ.","ja":"コロンボです。「l」は「ロ」に なります。日本語に「l」の おとが ないので、ぜんぶ ら行に なります。「mb」は「ンボ」です。","si":"කොළඹ, කටකනා වලින්. l ශබ්දය ロ බවට - ජපන් භාෂාවේ l නැති නිසා හැම l එකක්ම ら පේළියට යනවා. mb ශබ්දය ンボ බවට."}},{"w":"こうじょう","r":"KOUJOU","en":"factory","si":"කර්මාන්තශාලාව","note":{"en":"Factory. Many specified-skilled-worker jobs are in one. Both halves end in a long o written with う: ko-u, jo-u.","ja":"こうじょうです。とくていぎのうの しごとが おおい ばしょです。「こう」も「じょう」も ながい おとです。","si":"කර්මාන්තශාලාව. විශේෂිත නිපුණතා රැකියා බොහොමයක් තියෙන්නේ එහෙයි. ශබ්ද දෙකම දිගුයි: ko-u-jo-u."}},{"w":"でんしゃ","r":"DENSHA","en":"train","si":"දුම්රිය","note":{"en":"Train. しゃ is one beat, not two — でんしゃ has three beats: de-n-sha. Getting this wrong is a common listening mistake.","ja":"でんしゃです。「しゃ」は 1はくです。「で・ん・しゃ」で 3はく。ここを まちがえる人が おおいです。","si":"දුම්රිය. しゃ බීට් එකයි, දෙකක් නෙවෙයි. でんしゃ බීට් තුනයි: de-n-sha. ශ්‍රවණයේදී බහුලව වැරදෙන තැනක්."}},{"w":"びょういん","r":"BYOUIN","en":"hospital","si":"රෝහල","note":{"en":"Hospital. Careful: びよういん with a big よ means hair salon. The small ょ changes the meaning completely.","ja":"びょういんです。大きい「よ」の 「びよういん」は hair salon です。小さい「ょ」で いみが かわります。","si":"රෝහල. පරෙස්සම් - ලොකු よ එක්ක びよういん කියන්නේ කොණ්ඩා සැලූන් එකට. කුඩා ょ අර්ථය සම්පූර්ණයෙන් වෙනස් කරනවා."}},{"w":"きっぷ","r":"KIPPU","en":"ticket","si":"ටිකට් එක","note":{"en":"Ticket. The small っ makes you stop for one beat before p. Say ki-(stop)-pu, not kipu.","ja":"きっぷです。小さい「っ」で 1はく とまります。「き・っ・ぷ」で 3はくです。","si":"ටිකට් එක. කුඩා っ නිසා p කලින් බීට් එකක් නවතිනවා. ki-(නවතී)-pu, kipu නෙවෙයි."}},{"w":"みず","r":"MIZU","en":"water","si":"වතුර","note":{"en":"Water. In a Japanese restaurant water is free and served automatically, often with ice even in winter.","ja":"みずです。日本の レストランでは むりょうです。ふゆでも こおりが 入って います。","si":"වතුර. ජපන් අවන්හලක වතුර නොමිලේ, ඉබේම ගෙනත් දෙනවා - සීතලේ වුණත් අයිස් එක්ක."}},{"w":"ゴミ","r":"GOMI","en":"rubbish","si":"කසළ","note":{"en":"Rubbish. Japan separates it strictly — burnable, plastic, cans, bottles — and each type has its own collection day. Getting it wrong annoys neighbours fast.","ja":"ゴミです。日本では もえるゴミ、プラスチック、かん、びんに わけます。出す 日も きまって います。","si":"කසළ. ජපානයේ දැඩි ලෙස වර්ග කරනවා - දැවෙන, ප්ලාස්ටික්, ටින්, බෝතල් - එකිනෙකට එකතු කරන දවසත් වෙනස්."}},{"w":"やすみ","r":"YASUMI","en":"day off / holiday","si":"නිවාඩුව","note":{"en":"A day off. To ask for one: 休みをとってもいいですか. Ask early — in Japan sudden requests are harder to grant.","ja":"やすみです。「やすみを とっても いいですか」と ききます。はやめに いうと いいです。","si":"නිවාඩුව. 休みをとってもいいですか කියලා අහන්න. කලින්ම කියන්න - හදිසි ඉල්ලීම් ජපානයේ අපහසුයි."}},{"w":"ありがとう","r":"ARIGATOU","en":"thank you","si":"ස්තූතියි","note":{"en":"Thank you. The polite form adds ございます. Note the long vowel at the end: to-u, not just to.","ja":"ありがとうです。ていねいには 「ありがとう ございます」。さいごは ながい おと「とう」です。","si":"ස්තූතියි. ආචාරශීලී ආකාරය ございます එකතු කරනවා. අගට දිගු ස්වරය: to-u, to විතරක් නෙවෙයි."}}],"quick":[{"w":"いぬ","r":"inu","en":"dog","si":"බල්ලා"},{"w":"ねこ","r":"neko","en":"cat","si":"පූසා"},{"w":"さかな","r":"sakana","en":"fish","si":"මාළු"},{"w":"みず","r":"mizu","en":"water","si":"වතුර"},{"w":"ほん","r":"hon","en":"book","si":"පොත"},{"w":"やま","r":"yama","en":"mountain","si":"කන්ද"},{"w":"かわ","r":"kawa","en":"river","si":"ගඟ"},{"w":"うみ","r":"umi","en":"sea","si":"මුහුද"},{"w":"そら","r":"sora","en":"sky","si":"අහස"},{"w":"はな","r":"hana","en":"flower","si":"මල"},{"w":"くるま","r":"kuruma","en":"car","si":"කාර් එක"},{"w":"ともだち","r":"tomodachi","en":"friend","si":"යාළුවා"},{"w":"かぞく","r":"kazoku","en":"family","si":"පවුල"},{"w":"あさ","r":"asa","en":"morning","si":"උදේ"},{"w":"よる","r":"yoru","en":"night","si":"රාත්‍රිය"},{"w":"たべる","r":"taberu","en":"to eat","si":"කනවා"},{"w":"のむ","r":"nomu","en":"to drink","si":"බොනවා"},{"w":"みる","r":"miru","en":"to see","si":"බලනවා"},{"w":"きく","r":"kiku","en":"to listen","si":"අහනවා"},{"w":"ちいさい","r":"chiisai","en":"small","si":"පොඩි"},{"w":"しごと","r":"shigoto","en":"work","si":"වැඩ"},{"w":"てがみ","r":"tegami","en":"letter","si":"ලිපිය"},{"w":"くすり","r":"kusuri","en":"medicine","si":"බෙහෙත"},{"w":"たまご","r":"tamago","en":"egg","si":"බිත්තරය"},{"w":"パン","r":"pan","en":"bread","si":"පාන්"},{"w":"テレビ","r":"terebi","en":"TV","si":"රූපවාහිනිය"},{"w":"ラジオ","r":"rajio","en":"radio","si":"රේඩියෝ"},{"w":"バス","r":"basu","en":"bus","si":"බස් එක"},{"w":"ホテル","r":"hoteru","en":"hotel","si":"හෝටලය"},{"w":"カメラ","r":"kamera","en":"camera","si":"කැමරාව"},{"w":"ペン","r":"pen","en":"pen","si":"පෑන"},{"w":"ドア","r":"doa","en":"door","si":"දොර"},{"w":"シャツ","r":"shatsu","en":"shirt","si":"කමිසය"},{"w":"ズボン","r":"zubon","en":"trousers","si":"කලිසම"},{"w":"カレー","r":"karee","en":"curry","si":"කරි"},{"w":"ミルク","r":"miruku","en":"milk","si":"කිරි"}],"special":[{"w":"がっこう","r":"gakkou","en":"school","si":"පාසල","kind":"t","bad":["がこう","がっこ","がこお"]},{"w":"きって","r":"kitte","en":"stamp","si":"මුද්දරය","kind":"t","bad":["きて","きっつて","きてて"]},{"w":"ざっし","r":"zasshi","en":"magazine","si":"සඟරාව","kind":"t","bad":["ざし","ざっしい","ざつし"]},{"w":"いっしょ","r":"issho","en":"together","si":"එකට","kind":"t","bad":["いしょ","いっしょう","いつしょ"]},{"w":"きっぷ","r":"kippu","en":"ticket","si":"ටිකට් එක","kind":"t","bad":["きぷ","きっぷう","きつぷ"]},{"w":"さっき","r":"sakki","en":"a moment ago","si":"ටික වෙලාවකට කලින්","kind":"t","bad":["さき","さっきい","さつき"]},{"w":"にっき","r":"nikki","en":"diary","si":"දිනපොත","kind":"t","bad":["にき","につき","にっきい"]},{"w":"しゅっしん","r":"shusshin","en":"hometown","si":"උපන් ගම","kind":"t","bad":["しゅしん","しゅっしいん","しゆっしん"]},{"w":"コーヒー","r":"koohii","en":"coffee","si":"කෝපි","kind":"c","bad":["コヒー","コーヒ","コオヒイ"]},{"w":"タクシー","r":"takushii","en":"taxi","si":"ටැක්සි","kind":"c","bad":["タクシ","タークシー","タクシイ"]},{"w":"ノート","r":"nooto","en":"notebook","si":"නෝට්බුක්","kind":"c","bad":["ノト","ノオト","ノートー"]},{"w":"スプーン","r":"supuun","en":"spoon","si":"හැන්ද","kind":"c","bad":["スプン","スープン","スプウン"]},{"w":"テーブル","r":"teeburu","en":"table","si":"මේසය","kind":"c","bad":["テブル","テエブル","テーブール"]},{"w":"サッカー","r":"sakkaa","en":"football","si":"පාපන්දු","kind":"c","bad":["サカー","サッカ","サッカア"]},{"w":"おおきい","r":"ookii","en":"big","si":"ලොකු","kind":"c","bad":["おきい","おおき","おうきい"]},{"w":"せんせい","r":"sensei","en":"teacher","si":"ගුරුවරයා","kind":"c","bad":["せんせ","せせい","せんせえ"]},{"w":"でんわ","r":"denwa","en":"telephone","si":"දුරකථනය","kind":"n","bad":["でわ","でんんわ","でぬわ"]},{"w":"しんぶん","r":"shinbun","en":"newspaper","si":"පත්තරය","kind":"n","bad":["しぶん","しんぶ","しんふん"]},{"w":"げんき","r":"genki","en":"well / healthy","si":"සනීපෙන්","kind":"n","bad":["げき","げんぎ","げんきい"]},{"w":"かんじ","r":"kanji","en":"kanji","si":"කන්ජි","kind":"n","bad":["かじ","かんち","かんじい"]},{"w":"あんぜん","r":"anzen","en":"safety","si":"ආරක්ෂාව","kind":"n","bad":["あぜん","あんせん","あんぜ"]},{"w":"うんてん","r":"unten","en":"driving","si":"රිය පැදවීම","kind":"n","bad":["うてん","うんて","うんでん"]},{"w":"ばんごう","r":"bangou","en":"number","si":"අංකය","kind":"n","bad":["ばごう","ばんご","ばんごお"]}]},"guide":{"sections":[{"id":"two-scripts","title":{"en":"Two kana, one sound system","si":"කනා දෙකක්, ශබ්ද පද්ධතියක්","ja":"ひらがなと カタカナ"},"body":{"en":["Hiragana and katakana are two ways of writing exactly the same sounds. あ and ア are both a. There is no difference in pronunciation at all — only in when each is used.","Hiragana is the default: ordinary Japanese words, and the small grammar pieces between them.","Katakana is for words that came from another language, country and place names, and sounds. Your own name and country will be written in katakana in Japan, so katakana is not something to leave for later."],"si":["හිරගනා සහ කටකනා යනු එකම ශබ්ද ලියන ක්‍රම දෙකක්. あ සහ ア දෙකම a. උච්චාරණයේ කිසිම වෙනසක් නැහැ — වෙනස තියෙන්නේ කවදා පාවිච්චි කරනවාද කියන එකේ පමණයි.","හිරගනා තමයි සාමාන්‍ය ක්‍රමය: සාමාන්‍ය ජපන් වචන සහ ඒවා අතර එන කුඩා ව්‍යාකරණ කොටස්.","කටකනා පාවිච්චි කරන්නේ වෙනත් භාෂාවකින් ආපු වචන, රටවල් සහ ස්ථානවල නම්, සහ ශබ්ද වලට. ඔබේ නමයි රටයි ජපානයේදී ලියන්නේ කටකනා වලින්, ඒ නිසා කටකනා පස්සට දාන්න එපා."],"ja":["ひらがなと カタカナは、おなじ おとを かく 2つの ほうほうです。「あ」も「ア」も a です。はつおんは まったく おなじで、つかう ばめんだけが ちがいます。","ひらがなが きほんです。ふつうの 日本語の ことばと、あいだに 入る みじかい ぶぶんに つかいます。","カタカナは、がいこくから きた ことば、くにや ばしょの なまえ、おとに つかいます。あなたの なまえも くにの なまえも 日本では カタカナで かかれます。あとまわしに できません。"]},"examples":[{"kana":"みず","romaji":"mizu","gloss":"water — an ordinary word"},{"kana":"パン","romaji":"pan","gloss":"bread — came from Portuguese"},{"kana":"スリランカ","romaji":"SURIRANKA","gloss":"Sri Lanka — a country name"}]},{"id":"beats","title":{"en":"One kana, one beat","si":"එක කනා අකුරක් = එක බීට් එකක්","ja":"1つの かな＝1はく"},"body":{"en":["Japanese is counted in beats, not syllables. Each full-size kana is exactly one beat, and every beat takes the same length of time.","This is the single most useful idea on this page. If you keep the beats even, you will be understood even when your pronunciation is not perfect. If you rush some and stretch others, you will not.","Try clapping once per kana as you read. にほん is three claps: に・ほ・ん."],"si":["ජපන් භාෂාව ගණන් කරන්නේ අක්ෂර වලින් නෙවෙයි, බීට් වලින්. සම්පූර්ණ ප්‍රමාණයේ එක කනා අකුරක් හරියටම බීට් එකයි, හැම බීට් එකක්ම එකම කාලයක් ගන්නවා.","මේ පිටුවේ වැදගත්ම අදහස මෙයයි. බීට් සමානව තියාගත්තොත්, උච්චාරණය පරිපූර්ණ නැතත් ඔබව තේරුම් ගන්නවා. සමහර ඒවා ඉක්මන් කරලා අනිත් ඒවා දිග ඇරියොත් තේරෙන්නේ නැහැ.","කියවනකොට එක කනා අකුරකට එක අත්පොළසනක් ගහන්න. にほん කියන්නේ අත්පොළසන් තුනයි: に・ほ・ん."],"ja":["日本語は はくで かぞえます。大きい かな 1つが ちょうど 1はくで、どの はくも おなじ ながさです。","このページで いちばん だいじな かんがえかたです。はくを そろえれば、はつおんが かんぺきでなくても つうじます。はやくしたり のばしたり すると つうじません。","よみながら かな 1つに 1かい てを たたいて みてください。「にほん」は 3かいです。に・ほ・ん。"]},"examples":[{"kana":"に・ほ・ん","romaji":"nihon","gloss":"3 beats"},{"kana":"た・ま・ご","romaji":"tamago","gloss":"3 beats"},{"kana":"と・う・きょ・う","romaji":"toukyou","gloss":"4 beats — きょ is one"}]},{"id":"dakuten","title":{"en":"The two marks: ゛and ゜","si":"සලකුණු දෙක: ゛සහ ゜","ja":"だくおん・はんだくおん"},"body":{"en":["Two small marks in the top right corner change the consonant. Nothing else about the kana changes.","The two-stroke mark ゛turns k→g, s→z, t→d, h→b. The circle ゜only goes on the は row and turns h→p.","So は ば ぱ are the same shape three times over. Reading them apart quickly is a matter of practice, not of learning new characters."],"si":["දකුණු ඉහළ කොනේ කුඩා සලකුණු දෙකක් ව්‍යඤ්ජනය වෙනස් කරනවා. කනා අකුරේ අනිත් කිසිවක් වෙනස් වෙන්නේ නැහැ.","ඉරි දෙකේ සලකුණ ゛මගින් k→g, s→z, t→d, h→b බවට පත් වෙනවා. රවුම ゜යන්නේ は පේළියට විතරයි, h→p බවට හරවනවා.","එහෙනම් は ば ぱ කියන්නේ එකම හැඩය තුන් වතාවක්. ඒවා ඉක්මනින් වෙන් කරගන්න පුරුද්ද ඕනේ, අලුත් අකුරු ඉගෙන ගන්න ඕනේ නැහැ."],"ja":["右うえの 小さい しるしで、しいんが かわります。かなの ほかの ぶぶんは かわりません。","「゛」は k→g、s→z、t→d、h→b に します。「゜」は は行だけに つき、h→p に します。","「は」「ば」「ぱ」は おなじ かたちが 3かい でてくる ということです。あたらしい 字を おぼえるのでは なく、みわける れんしゅうです。"]},"examples":[{"kana":"か → が","romaji":"ka → ga","gloss":""},{"kana":"し → じ","romaji":"shi → ji","gloss":""},{"kana":"は → ば → ぱ","romaji":"ha → ba → pa","gloss":"only は-row takes ゜"}]},{"id":"youon","title":{"en":"Small ゃ ゅ ょ — still one beat","si":"කුඩා ゃ ゅ ょ — තවමත් බීට් එකයි","ja":"ようおん（小さい ゃ ゅ ょ）"},"body":{"en":["A small ゃ ゅ ょ attaches to the i-column kana before it, and the two together make a single beat.","Size is the whole difference, and it changes the word. びょういん (byouin) is a hospital. びよういん (biyouin), with a full-size よ, is a hair salon.","When you write by hand, make the small kana clearly smaller — about half height."],"si":["කුඩා ゃ ゅ ょ එකක් ඊට කලින් එන i තීරුවේ කනා අකුරට එකතු වෙනවා, දෙකම එකට බීට් එකක් හදනවා.","ප්‍රමාණය තමයි මුළු වෙනස, ඒක වචනයේ අර්ථය වෙනස් කරනවා. びょういん (byouin) කියන්නේ රෝහල. ලොකු よ එක්ක びよういん (biyouin) කියන්නේ කොණ්ඩා සැලූන් එකට.","අතින් ලියනකොට කුඩා අකුර පැහැදිලිවම කුඩාවට ලියන්න — උසෙන් බාගයක් පමණ."],"ja":["小さい「ゃ ゅ ょ」は、まえの い だんの かなに くっついて、2つで 1はくに なります。","ちがいは 大きさ だけですが、いみが かわります。「びょういん」は hospital、大きい「よ」の「びよういん」は hair salon です。","てで かく ときは、小さい かなを はっきり 小さく（たかさ 半分ぐらい）かいて ください。"]},"examples":[{"kana":"きゃ","romaji":"kya","gloss":"1 beat"},{"kana":"びょういん","romaji":"byouin","gloss":"hospital — 4 beats"},{"kana":"びよういん","romaji":"biyouin","gloss":"hair salon — 5 beats"}]},{"id":"sokuon","title":{"en":"Small っ — a beat of silence","si":"කුඩා っ — නිශ්ශබ්ද බීට් එකක්","ja":"そくおん（小さい っ）"},"body":{"en":["A small っ is a beat where you say nothing. You stop, hold the stop for the length of one beat, then release into the next sound.","In romaji it appears as a doubled consonant: きっぷ is kippu. But do not think of it as two p sounds — think of it as a pause.","Dropping it changes the word, and it is the mistake most learners keep making longest. きて (kite) is come. きって (kitte) is a stamp."],"si":["කුඩා っ කියන්නේ ඔබ කිසිවක් නොකියන බීට් එකක්. නවතිනවා, බීට් එකක කාලයට නැවතීම තියාගන්නවා, ඊට පස්සේ ඊළඟ ශබ්දයට යනවා.","රෝමජි වල එය දෙගුණ වූ ව්‍යඤ්ජනයක් ලෙස පෙනෙනවා: きっぷ කියන්නේ kippu. ඒත් p ශබ්ද දෙකක් කියලා හිතන්න එපා — නැවතීමක් කියලා හිතන්න.","එය අත්හැරියොත් වචනය වෙනස් වෙනවා, ඒක බොහෝ ශිෂ්‍යයන් වැඩිම කාලයක් කරන වැරැද්ද. きて (kite) කියන්නේ එන්න. きって (kitte) කියන්නේ මුද්දරය."],"ja":["小さい「っ」は、なにも いわない 1はくです。とめて、1はくぶん とめたまま にして、つぎの おとに いきます。","ローマ字では しいんが 2つに なります。「きっぷ」＝kippu。でも p が 2つ あるのでは なく、「まが ある」と かんがえて ください。","ぬかすと いみが かわります。がくしゅうしゃが いちばん ながく まちがえる ところです。「きて」＝come、「きって」＝stamp。"]},"examples":[{"kana":"き・っ・て","romaji":"kitte","gloss":"stamp — 3 beats"},{"kana":"き・て","romaji":"kite","gloss":"come — 2 beats"},{"kana":"が・っ・こ・う","romaji":"gakkou","gloss":"school — 4 beats"}]},{"id":"chouon","title":{"en":"Long vowels — and why katakana uses ー","si":"දිගු ස්වර — කටකනා ー භාවිතා කරන්නේ ඇයි","ja":"ちょうおん（ながい おと）"},"body":{"en":["A long vowel is two beats of the same vowel, not one loud one. Hold it.","Katakana writes it with a bar: コーヒー. Hiragana writes it with a vowel kana instead: おおきい, せんせい, とうきょう. Katakana never uses おお or えい for this, and hiragana never uses ー.","This is purely a spelling rule, so it is worth learning as a rule rather than by ear — the sound gives you no clue about which to write."],"si":["දිගු ස්වරයක් කියන්නේ එකම ස්වරයේ බීට් දෙකක්, එක ශබ්ද නඟන එකක් නෙවෙයි. දිග අදින්න.","කටකනා එය ලියන්නේ ඉරකින්: コーヒー. හිරගනා ඒ වෙනුවට ස්වර අකුරක් යොදනවා: おおきい, せんせい, とうきょう. කටකනා මේකට おお හෝ えい කවදාවත් යොදන්නේ නැහැ, හිරගනා ー කවදාවත් යොදන්නේ නැහැ.","මේක සම්පූර්ණයෙන්ම ලිවීමේ නීතියක්, ඒ නිසා කනට අහගෙන නෙවෙයි නීතියක් විදිහට ඉගෙන ගන්න — ශබ්දයෙන් කුමක් ලියන්නද කියලා දැනගන්න බැහැ."],"ja":["ながい おとは、おなじ ぼいんの 2はくです。大きく いうのでは なく、のばします。","カタカナは ぼうで かきます（コーヒー）。ひらがなは ぼいんの かなで かきます（おおきい・せんせい・とうきょう）。カタカナで「おお」「えい」は つかわず、ひらがなで「ー」は つかいません。","これは かきかたの ルールです。おとでは どちらか わからないので、ルールとして おぼえて ください。"]},"examples":[{"kana":"コーヒー","romaji":"koohii","gloss":"katakana → ー"},{"kana":"おおきい","romaji":"ookii","gloss":"hiragana → おお"},{"kana":"せんせい","romaji":"sensei","gloss":"hiragana → えい"}]},{"id":"romaji","title":{"en":"Why you see shi and si","si":"shi සහ si දෙකම පෙනෙන්නේ ඇයි","ja":"ローマ字が 2しゅるい ある りゆう"},"body":{"en":["There are two romaji systems in use. Hepburn writes shi, chi, tsu, fu, ji. Kunrei writes si, ti, tu, hu, zi. They describe the same kana.","Signs, stations and passports use Hepburn, so that is the one to read fluently. Japanese keyboards accept both, so type whichever is faster for you.","This drill accepts both spellings in the typing questions."],"si":["රෝමජි ක්‍රම දෙකක් භාවිතයේ තියෙනවා. හෙප්බර්න් ලියන්නේ shi, chi, tsu, fu, ji. කුන්රේ ලියන්නේ si, ti, tu, hu, zi. දෙකම විස්තර කරන්නේ එකම කනා අකුරු.","සලකුණු, දුම්රියපොළවල් සහ විදේශ ගමන් බලපත්‍ර භාවිතා කරන්නේ හෙප්බර්න්, ඒ නිසා නිතැතින් කියවන්න ඕනේ ඒක. ජපන් යතුරුපුවරු දෙකම පිළිගන්නවා, ඒ නිසා ඔබට ඉක්මන් එක ලියන්න.","මේ ඩ්‍රිල් එකේ ලිවීමේ ප්‍රශ්න වලදී දෙකම පිළිගන්නවා."],"ja":["ローマ字には 2つの しきが あります。ヘボンしきは shi・chi・tsu・fu・ji、くんれいしきは si・ti・tu・hu・zi。おなじ かなを あらわして います。","かんばん・えき・パスポートは ヘボンしきです。すらすら よめるように するのは こちらです。日本語の キーボードは どちらでも 入力できます。","この ドリルの 入力もんだいは、どちらでも せいかいに なります。"]},"examples":[{"kana":"し","romaji":"shi / si","gloss":""},{"kana":"つ","romaji":"tsu / tu","gloss":""},{"kana":"ふ","romaji":"fu / hu","gloss":""}]}]},"numbers":{"ones":["ゼロ","いち","に","さん","よん","ご","ろく","なな","はち","きゅう"],"onesAlt":{"0":"れい","4":"し","7":"しち","9":"く"},"tensPrefix":["","","に","さん","よん","ご","ろく","なな","はち","きゅう"],"hundreds":["","ひゃく","にひゃく","さんびゃく","よんひゃく","ごひゃく","ろっぴゃく","ななひゃく","はっぴゃく","きゅうひゃく"],"thousands":["","せん","にせん","さんぜん","よんせん","ごせん","ろくせん","ななせん","はっせん","きゅうせん"],"man":"まん","counters":{"tsu":{"jp":"〜つ","en":"things (general)","si":"දේවල් (සාමාන්‍ය)","max":10,"suffix":"つ","whole":{"1":"ひとつ","2":"ふたつ","3":"みっつ","4":"よっつ","5":"いつつ","6":"むっつ","7":"ななつ","8":"やっつ","9":"ここのつ","10":"とお"},"ja":"ものを かぞえる ことば"},"nin":{"jp":"〜人","en":"people","si":"මිනිසුන්","max":99,"suffix":"にん","whole":{"1":"ひとり","2":"ふたり"},"last":{"4":"よにん","7":"しちにん"},"ten":"じゅうにん","ja":"ひと"},"ko":{"jp":"〜個","en":"small objects","si":"කුඩා දේවල්","max":99,"suffix":"こ","last":{"1":"いっこ","6":"ろっこ","8":"はっこ"},"ten":"じゅっこ","ja":"小さい もの"},"hon":{"jp":"〜本","en":"long thin things","si":"දිග සිහින් දේවල්","max":99,"suffix":"ほん","last":{"1":"いっぽん","3":"さんぼん","6":"ろっぽん","8":"はっぽん"},"ten":"じゅっぽん","ja":"ながくて ほそい もの"},"mai":{"jp":"〜枚","en":"flat things","si":"පැතලි දේවල්","max":99,"suffix":"まい","ja":"うすくて たいらな もの"},"sai":{"jp":"〜歳","en":"years old","si":"වයස","max":99,"suffix":"さい","whole":{"20":"はたち"},"last":{"1":"いっさい","8":"はっさい"},"ten":"じゅっさい","ja":"とし"},"en":{"jp":"〜円","en":"yen","si":"යෙන්","max":99999,"suffix":"えん","last":{"4":"よえん"},"ja":"おかね"},"nichi":{"jp":"〜日","en":"days of the month","si":"මාසයේ දින","max":31,"suffix":"にち","whole":{"1":"ついたち","2":"ふつか","3":"みっか","4":"よっか","5":"いつか","6":"むいか","7":"なのか","8":"ようか","9":"ここのか","10":"とおか","14":"じゅうよっか","20":"はつか","24":"にじゅうよっか","17":"じゅうしちにち","19":"じゅうくにち","27":"にじゅうしちにち","29":"にじゅうくにち"},"ja":"月の 日"}},"hours":{"1":"いちじ","2":"にじ","3":"さんじ","4":"よじ","5":"ごじ","6":"ろくじ","7":"しちじ","8":"はちじ","9":"くじ","10":"じゅうじ","11":"じゅういちじ","12":"じゅうにじ"},"minutesLast":{"1":"いっぷん","2":"にふん","3":"さんぷん","4":"よんぷん","5":"ごふん","6":"ろっぷん","7":"ななふん","8":"はっぷん","9":"きゅうふん"},"minutesTen":"じゅっぷん","half":"はん","guide":[{"id":"n-basics","title":{"en":"0 to 10, and the numbers with two readings","si":"0 සිට 10, සහ කියවීම් දෙකක් ඇති අංක","ja":"0〜10 と、よみが 2つ ある すうじ"},"body":{"en":["Four numbers have two readings, and the one you use depends on what follows. 4 is よん or し, 7 is なな or しち, 9 is きゅう or く, and 0 is ゼロ or れい.","On its own, use よん, なな, きゅう, ゼロ. They are safer and clearer — し also means death, and く also means pain, so speakers avoid them where they can.","But the other reading survives in fixed places: 4時 is よじ, 7時 is しちじ, 9時 is くじ. Times are the main place you must know both."],"si":["අංක හතරකට කියවීම් දෙකක් තියෙනවා, කුමක් භාවිතා කරනවාද කියන එක ඊට පස්සේ එන දේ මතයි. 4 කියන්නේ よん හෝ し, 7 කියන්නේ なな හෝ しち, 9 කියන්නේ きゅう හෝ く, 0 කියන්නේ ゼロ හෝ れい.","තනිව කියනකොට よん, なな, きゅう, ゼロ පාවිච්චි කරන්න. ඒවා ආරක්ෂිතයි — し කියන්නේ මරණයටත්, く කියන්නේ වේදනාවටත් නිසා කතා කරන අය ඒවා මඟහරිනවා.","ඒත් අනෙක් කියවීම ස්ථිර තැන්වල ඉතිරි වෙනවා: 4時 කියන්නේ よじ, 7時 කියන්නේ しちじ, 9時 කියන්නේ くじ. වේලාව තමයි දෙකම දැනගත යුතු ප්‍රධාන තැන."],"ja":["4つの すうじには よみが 2つ あります。あとに くる ものが よみを きめます。4は よん か し、7は なな か しち、9は きゅう か く、0は ゼロ か れい です。","1つで いう ときは よん・なな・きゅう・ゼロ を つかいます。「し」は 死、「く」は 苦 と おなじ おとなので、さけられます。","でも きまった ばしょでは もう1つの よみが のこります。4時＝よじ、7時＝しちじ、9時＝くじ。時こくが いちばん だいじな ばしょです。"]},"examples":[{"num":"4","kana":"よん / し","gloss":"alone: よん"},{"num":"7","kana":"なな / しち","gloss":"alone: なな"},{"num":"9","kana":"きゅう / く","gloss":"alone: きゅう"}]},{"id":"n-build","title":{"en":"11 to 99 is simple addition","si":"11 සිට 99 දක්වා සරල එකතුවක්","ja":"11〜99 は たし算"},"body":{"en":["Japanese builds numbers exactly the way they are written. 23 is に + じゅう + さん — two tens and a three.","There is no separate word for eleven, twenty or thirty. Once you know 1 to 10 you know every number up to 99 with no extra learning.","Note that 10 on its own is じゅう, not いちじゅう."],"si":["ජපන් භාෂාවේ අංක හැදෙන්නේ ලියන ආකාරයටමයි. 23 කියන්නේ に + じゅう + さん — දහයවල් දෙකයි තුනයි.","එකොළහට හෝ විස්සට හෝ තිහට වෙනම වචනයක් නැහැ. 1 සිට 10 දක්වා දැනගත්තොත් 99 දක්වා හැම අංකයක්ම දන්නවා.","10 තනිව කියන්නේ じゅう, いちじゅう නෙවෙයි."],"ja":["日本語の すうじは かいた とおりに つくります。23は に＋じゅう＋さん です。","11や 20や 30の ための べつの ことばは ありません。1〜10を おぼえたら、99までは あたらしく おぼえる ものは ありません。","10 だけは じゅう です。いちじゅう とは いいません。"]},"examples":[{"num":"23","kana":"にじゅうさん","gloss":"2 tens + 3"},{"num":"10","kana":"じゅう","gloss":"not いちじゅう"},{"num":"99","kana":"きゅうじゅうきゅう","gloss":""}]},{"id":"n-big","title":{"en":"100, 1000, 10000 — where the sound changes","si":"100, 1000, 10000 — ශබ්දය වෙනස් වන තැන්","ja":"100・1000・10000 と 音の へんか"},"body":{"en":["Six numbers change sound when they meet ひゃく or せん. They are not exceptions to memorise one by one — they change because the sounds are hard to say together.","300 is さんびゃく, 600 is ろっぴゃく, 800 is はっぴゃく. 3000 is さんぜん and 8000 is はっせん. Everything else is regular.","10,000 is いちまん, never just まん. And Japanese counts in units of 10,000, so 100,000 is じゅうまん — ten man, not a new word."],"si":["අංක හයක් ひゃく හෝ せん සමඟ එනකොට ශබ්දය වෙනස් වෙනවා. ඒවා එකින් එක කටපාඩම් කරන්න ඕන ව්‍යතිරේක නෙවෙයි — ශබ්ද එකට කියන්න අමාරු නිසා වෙනස් වෙනවා.","300 කියන්නේ さんびゃく, 600 කියන්නේ ろっぴゃく, 800 කියන්නේ はっぴゃく. 3000 කියන්නේ さんぜん, 8000 කියන්නේ はっせん. අනිත් සියල්ල නීතිගතයි.","10,000 කියන්නේ いちまん, まん විතරක් නෙවෙයි. ජපන් භාෂාව 10,000 ඒකකවලින් ගණන් කරනවා, ඒ නිසා 100,000 කියන්නේ じゅうまん."],"ja":["6つの すうじだけ、ひゃく・せん と いっしょに なると 音が かわります。1つずつ おぼえる れいがいでは なく、いいにくいから かわります。","300は さんびゃく、600は ろっぴゃく、800は はっぴゃく。3000は さんぜん、8000は はっせん。ほかは ふつうです。","10,000は いちまん です。「まん」だけとは いいません。日本語は 1まん ずつ かぞえるので、100,000は じゅうまん です。"]},"examples":[{"num":"300","kana":"さんびゃく","gloss":"not さんひゃく"},{"num":"600","kana":"ろっぴゃく","gloss":""},{"num":"8000","kana":"はっせん","gloss":""}]},{"id":"n-counters","title":{"en":"Counters — why 1本 is いっぽん","si":"ගණන් කරන වචන — 1本 いっぽん වන්නේ ඇයි","ja":"かぞえかた — 1本が いっぽん に なる りゆう"},"body":{"en":["Japanese cannot count a thing with a bare number. It needs a counter word, chosen by the shape of the thing: 本 for long thin things, 枚 for flat things, 個 for small lumps, 人 for people.","The same three numbers keep changing: 1, 6 and 8 make the counter's first sound harder, and 3 sometimes makes it softer. 1本 いっぽん, 3本 さんぼん, 6本 ろっぽん, 8本 はっぽん.","Learn the pattern for 本 and the rest follows the same shape. Two counters are simply irregular and must be learned: ひとり and ふたり for one and two people."],"si":["ජපන් භාෂාවෙන් හිස් අංකයකින් දෙයක් ගණන් කරන්න බැහැ. දේවල හැඩය අනුව තෝරන ගණන් කරන වචනයක් ඕනේ: දිග සිහින් දේවලට 本, පැතලි දේවලට 枚, කුඩා ගුලිවලට 個, මිනිසුන්ට 人.","එකම අංක තුනක් නිතර වෙනස් වෙනවා: 1, 6, 8 ගණන් වචනයේ පළමු ශබ්දය තද කරනවා, 3 සමහර විට මෘදු කරනවා. 1本 いっぽん, 3本 さんぼん, 6本 ろっぽん, 8本 はっぽん.","本 සඳහා රටාව ඉගෙන ගත්තොත් අනිත් ඒවාත් එම හැඩයම. දෙකක් සරලව අක්‍රමවත්: එක් අයෙකුට ひとり, දෙදෙනෙකුට ふたり."],"ja":["日本語は すうじ だけでは ものを かぞえられません。ものの かたちで きまる ことばが ひつようです。ながくて ほそい ものは 本、たいらな ものは 枚、小さい ものは 個、人は 人。","かわるのは いつも おなじ 3つです。1・6・8は さいしょの 音を つよく し、3は やわらかく する ことが あります。1本 いっぽん、3本 さんぼん、6本 ろっぽん、8本 はっぽん。","本の パターンを おぼえれば、ほかも おなじ かたちです。人だけは とくべつで、1人 ひとり、2人 ふたり を おぼえて ください。"]},"examples":[{"num":"1本","kana":"いっぽん","gloss":""},{"num":"3本","kana":"さんぼん","gloss":""},{"num":"1人 / 2人","kana":"ひとり / ふたり","gloss":"irregular"}]},{"id":"n-time","title":{"en":"Telling the time","si":"වේලාව කීම","ja":"時こくの いいかた"},"body":{"en":["Hours are number + じ, with three you cannot guess: 4時 よじ, 7時 しちじ, 9時 くじ. The rest are regular.","Minutes are number + ふん, but after 1, 3, 4, 6, 8 and 10 it becomes ぷん. 1分 いっぷん, 3分 さんぷん, 6分 ろっぷん, 8分 はっぷん, 10分 じゅっぷん.","30 minutes past is usually 半 (はん), not さんじゅっぷん. Morning is 午前, afternoon is 午後, and both come before the time: 午後3時."],"si":["පැය කියන්නේ අංකය + じ, අනුමාන කරන්න බැරි තුනක් තියෙනවා: 4時 よじ, 7時 しちじ, 9時 くじ. ඉතිරිය නීතිගතයි.","විනාඩි කියන්නේ අංකය + ふん, ඒත් 1, 3, 4, 6, 8, 10 පස්සේ ぷん බවට හැරෙනවා. 1分 いっぷん, 3分 さんぷん, 6分 ろっぷん, 8分 はっぷん, 10分 じゅっぷん.","විනාඩි 30 සාමාන්‍යයෙන් කියන්නේ 半 (はん) කියලා, さんじゅっぷん නෙවෙයි. උදේ 午前, හවස 午後, දෙකම වේලාවට කලින් එනවා: 午後3時."],"ja":["「〜時」は すうじ＋じ ですが、あてられない ものが 3つ あります。4時 よじ、7時 しちじ、9時 くじ。ほかは ふつうです。","「〜分」は すうじ＋ふん ですが、1・3・4・6・8・10の あとは ぷん に なります。1分 いっぷん、3分 さんぷん、6分 ろっぷん、8分 はっぷん、10分 じゅっぷん。","30分は ふつう 「半」と いいます。さんじゅっぷん とは あまり いいません。ごぜんは 午前、ごごは 午後 で、時こくの まえに つきます（午後3時）。"]},"examples":[{"num":"4:00","kana":"よじ","gloss":"not よんじ"},{"num":"9:08","kana":"くじ はっぷん","gloss":""},{"num":"7:30","kana":"しちじ はん","gloss":""}]}],"alsoOk":{"nin":{"7":["ななにん"]},"en":{"4":["よんえん"],"7":["しちえん"]},"sai":{"20":["にじゅっさい","にじゅうさい"]},"nichi":{"17":["じゅうななにち"],"19":["じゅうきゅうにち"],"27":["にじゅうななにち"],"29":["にじゅうきゅうにち"]},"ko":{},"hon":{},"mai":{},"tsu":{}},"alsoOkTime":{"30":["さんじゅっぷん"]}},"tips":{"kana":[{"chars":["シ","ツ","ジ","ヅ"],"tip":{"ja":"シは 左から 右へ、ツは 上から 下へ 書きます。てんの ならびで 見わけます。シは たてに 2つ、ツは よこに 2つ。","en":"シ is written left to right, ツ from top to bottom. Look at the two dots: シ stacks them vertically, ツ lines them up across the top.","si":"シ ලියන්නේ වමේ සිට දකුණට, ツ ලියන්නේ උඩ සිට යටට. තිත් දෙක බලන්න: シ සිරස්ව, ツ තිරස්ව."}},{"chars":["ソ","ン","リ"],"tip":{"ja":"ソは 上から 下へ おろし、ンは 下から 上へ はねます。リは たて線が 2本で、右が ながい 形です。","en":"ソ comes down from the top, ン sweeps up from the bottom left, and リ is two uprights with the right one longer.","si":"ソ උඩ සිට පහළට, ン පහළ වමේ සිට උඩට, リ සිරස් ඉරි දෙකක් — දකුණ දිගයි."}},{"chars":["ク","ワ","ケ","タ","ヲ"],"tip":{"ja":"クは 2かく、ワは 2かくで 下が まるい、ケは 3かく、タは 3かくで 中に てんが あります。かくすうで 見わけます。","en":"Count the strokes: ク has two, ワ has two with a rounded base, ケ has three, タ has three plus a stroke inside.","si":"ඉරි ගණන බලන්න: ク දෙකයි, ワ දෙකයි පහළ වටයි, ケ තුනයි, タ තුනයි ඇතුළේ ඉරක් එක්ක."}},{"chars":["ノ","メ","ヌ","ス","ム"],"tip":{"ja":"ノは 1かく。メと ヌは ノに 1本 くわえた 形で、ヌだけ 上に よこ線が あります。スは 上が よこ線、ムは 中に てんが あります。","en":"ノ is one stroke. メ and ヌ add one stroke to it — only ヌ has a bar across the top. ス starts with a bar, ム has a dot inside.","si":"ノ එක ඉරයි. メ සහ ヌ ඊට එකක් එකතු කරනවා — ヌ වලට විතරයි උඩ තිරස් ඉරක්. ス උඩ ඉරකින් පටන් ගන්නවා, ム ඇතුළේ තිතක්."}},{"chars":["ハ","ヘ"],"tip":{"ja":"ハは 2本の 線が はなれて います。ヘは 1本 つながって います。","en":"ハ is two separate strokes. ヘ is a single connected line.","si":"ハ වෙන් වූ ඉරි දෙකක්. ヘ එකට සම්බන්ධ එක ඉරක්."}},{"chars":["コ","ユ","ヨ","ロ"],"tip":{"ja":"コは よこ線 1本、ヨは よこ線 3本、ロは しかくに とじます。ユは たて線が 下から 出ます。","en":"コ has one crossbar, ヨ has three, ロ closes into a box. ユ has an upright rising from the bottom line.","si":"コ තිරස් ඉරක්, ヨ තුනක්, ロ හතරැස්සක් ලෙස වැසෙනවා. ユ පහළ ඉරෙන් උඩට සිරස් ඉරක්."}},{"chars":["チ","テ","ナ","キ"],"tip":{"ja":"上の 線が 1本なら チと ナ、2本なら テと キ。下が はねたら チ・キ、まっすぐなら ナ・テ。","en":"One bar on top means チ or ナ; two bars mean テ or キ. A hooked tail means チ or キ; a straight one means ナ or テ.","si":"උඩ ඉරක් නම් チ හෝ ナ; දෙකක් නම් テ හෝ キ. පහළ කොක්කක් නම් チ හෝ キ; කෙළින් නම් ナ හෝ テ."}},{"chars":["サ","セ"],"tip":{"ja":"サは たて線が 下に つきぬけます。セは 下で とまり、右に まがります。","en":"サ has an upright that runs through and below. セ stops at the bottom line and turns right.","si":"サ වල සිරස් ඉර පහළට කැපෙනවා. セ පහළ ඉරේ නැවතී දකුණට හැරෙනවා."}},{"chars":["レ","ル","ヒ"],"tip":{"ja":"レは 1かく。ルは レに 左の 1本を たします。ヒは よこ線が 先に きます。","en":"レ is one stroke. ル is レ with one stroke added on the left. ヒ starts with a horizontal line.","si":"レ එක ඉරයි. ル කියන්නේ レ ට වමෙන් එකක් එකතු කළ එක. ヒ තිරස් ඉරකින් පටන් ගන්නවා."}},{"chars":["ウ","ワ","ラ"],"tip":{"ja":"上に てんが あれば ウ。てんが なくて 上が よこ線なら ラ。上が ひらいて いれば ワ。","en":"A dot on top means ウ. No dot but a bar on top means ラ. An open top means ワ.","si":"උඩ තිතක් නම් ウ. තිත නැතුව උඩ ඉරක් නම් ラ. උඩ විවෘත නම් ワ."}},{"chars":["ア","マ","ム","ヤ"],"tip":{"ja":"アは 上の よこ線から。マは 上が ひらいて います。ムは 中に てんが 1つ。ヤは 右上に てんが 出ます。","en":"ア starts from a bar on top. マ has an open top. ム has a dot inside. ヤ has a stroke rising to the upper right.","si":"ア උඩ ඉරකින්. マ උඩ විවෘතයි. ム ඇතුළේ තිතක්. ヤ උඩ දකුණට ඉරක්."}},{"chars":["ネ","ホ","オ"],"tip":{"ja":"ネは 上に てんが あります。ホと オは よこ線から。ホは 下に てんが 2つ、オは ありません。","en":"ネ has a dot on top. ホ and オ start from a bar; ホ has two dots at the bottom, オ has none.","si":"ネ උඩ තිතක්. ホ සහ オ ඉරකින් පටන් ගන්නවා; ホ පහළ තිත් දෙකක්, オ නැහැ."}},{"chars":["あ","お","む"],"tip":{"ja":"あは 中が むすばれて います。おは 右上に てんが あります。むは 下に てんが 1つ、右に つきます。","en":"あ has a loop in the middle. お has a dot at the upper right. む has a dot at the lower right.","si":"あ මැද වළල්ලක්. お උඩ දකුණේ තිතක්. む පහළ දකුණේ තිතක්."}},{"chars":["い","り","こ"],"tip":{"ja":"いは 2本が はなれ、左が ながい。りは 2本が ちかく、右が ながい。こは よこに 2本です。","en":"い has two separate strokes with the left one longer. り has two close strokes with the right one longer. こ is two horizontal strokes.","si":"い ඉරි දෙකක් වෙන් වී, වම දිගයි. り ඉරි දෙක ළඟින්, දකුණ දිගයි. こ තිරස් ඉරි දෙකක්."}},{"chars":["き","さ","ち","ら"],"tip":{"ja":"きは よこ線 2本、さは 1本。ちは さを 左右 ぎゃくに した 形です。らは 上に 小さい てんが あります。","en":"き has two crossbars, さ has one. ち is さ mirrored left to right. ら has a small stroke on top.","si":"き තිරස් ඉරි දෙකක්, さ එකක්. ち කියන්නේ さ පෙරළූ එක. ら උඩ කුඩා ඉරක්."}},{"chars":["け","は","ほ","ま","ば","ぱ"],"tip":{"ja":"けは よこ線 1本、はは 2本、ほは 3本です。まは たて線が 下に つきぬけます。","en":"け has one crossbar, は has two, ほ has three. ま is the one whose upright runs through to the bottom.","si":"け තිරස් ඉරක්, は දෙකක්, ほ තුනක්. ま වල සිරස් ඉර පහළට කැපෙනවා."}},{"chars":["ぬ","め","ね","れ","わ"],"tip":{"ja":"むすびが あるのは ぬと ね。ぬは 左が まるく、ねは たて線から はじまります。めと れと わは むすびが ありません。","en":"Only ぬ and ね end in a loop. ぬ starts with a curve, ね with an upright. め, れ and わ have no loop.","si":"වළල්ලක් තියෙන්නේ ぬ සහ ね වලට විතරයි. ぬ වක්‍රයකින්, ね සිරස් ඉරකින්. め, れ, わ වලට වළල්ලක් නැහැ."}},{"chars":["る","ろ","そ"],"tip":{"ja":"るは さいごに むすびます。ろは むすばずに とめます。そは 上に おれた 線が あります。","en":"る ends in a loop, ろ ends without one. そ has a zig-zag at the top.","si":"る අගට වළල්ලක්, ろ වළල්ලක් නැහැ. そ උඩ නැමුණු ඉරක්."}},{"chars":["し","つ","へ"],"tip":{"ja":"しは たてに ながく、下で 右に はねます。つは よこに ながい 形です。へは 山の 形です。","en":"し is tall and hooks to the right at the bottom. つ is wide and flat. へ is a shallow peak.","si":"し උසයි, පහළ දකුණට කොක්කක්. つ පළලයි. へ කන්දක් වගේ."}},{"chars":["た","な","に"],"tip":{"ja":"たの 左は 「十」の 形で、右下は とめます。なは 右下に むすびが あります。には 左が たて線 1本だけです。","en":"た has a cross shape on the left and stops at the lower right. な ends in a loop there. に has just one upright on the left.","si":"た වම පැත්තේ කුරුසයක්, පහළ දකුණේ නවතිනවා. な එතන වළල්ලකින් අවසන් වෙනවා. に වම පැත්තේ එක සිරස් ඉරක් විතරයි."}},{"chars":["う","つ","ふ"],"tip":{"ja":"うは 上に てんが あります。つは てんが ありません。ふは 上の てんの 下に 3つの ぶぶんが あります。","en":"う has a dot on top, つ has none, ふ has a dot plus three separate pieces below it.","si":"う උඩ තිතක්, つ තිතක් නැහැ, ふ තිතක් සහ පහළින් කොටස් තුනක්."}},{"chars":["ま","も","す"],"tip":{"ja":"まは よこ線 2本、もは 2本ですが たて線が 左から 出ます。すは よこ線 1本で 下に むすびます。","en":"ま has two crossbars. も has two as well, but the upright starts on the left. す has one crossbar and a loop below.","si":"ま තිරස් ඉරි දෙකක්. も දෙකක්, ඒත් සිරස් ඉර වමෙන්. す එකක් සහ පහළ වළල්ලක්."}},{"chars":["シ","ツ","ソ","ン","ジ","ズ"],"tip":{"ja":"この 6つは ぜんぶ 同じ 見わけかたです。左から 右に 書くのが シ・ン、上から 下に 書くのが ツ・ソ。てんが 2つなら シ・ツ、1つなら ソ・ン。てんてんが つくと ジ・ズです。","en":"All six use one rule. シ and ン are written left to right; ツ and ソ from the top down. Two dots means シ or ツ, one dot means ソ or ン. Add the two marks and you get ジ and ズ.","si":"මේ හය එකම නීතියක්. シ සහ ン වමේ සිට දකුණට; ツ සහ ソ උඩ සිට යටට. තිත් දෙකක් නම් シ හෝ ツ, එකක් නම් ソ හෝ ン. සලකුණු දෙක එකතු කළාම ジ සහ ズ."}},{"chars":["す","む","ま"],"tip":{"ja":"すは よこ線が 1本で 下に むすびます。むは よこ線 1本で 右下に てんが あります。まは よこ線が 2本です。","en":"す has one crossbar and a loop below. む has one crossbar and a dot at the lower right. ま has two crossbars.","si":"す තිරස් ඉරක් සහ පහළ වළල්ලක්. む තිරස් ඉරක් සහ පහළ දකුණේ තිතක්. ま තිරස් ඉරි දෙකක්."}},{"chars":["く","へ","て","ひ"],"tip":{"ja":"くは たてに おれます。へは よこに ひくい 山です。ては 上の よこ線から 左下へ。ひは 左が たてに ながく、右へ ながれます。","en":"く bends downward, へ is a low horizontal peak, て starts from a bar on top and sweeps to the lower left, ひ has a tall left side flowing to the right.","si":"く පහළට නැමෙනවා, へ පහත් තිරස් කන්දක්, て උඩ ඉරකින් පහළ වමට, ひ වම උසයි දකුණට ගලනවා."}},{"chars":["ふ","え"],"tip":{"ja":"ふは てんの 下に 3つの ぶぶんが あります。えは 上の てんから 下へ つづく 1本の 形です。","en":"ふ has three separate pieces under the dot. え runs as one connected shape from the dot downward.","si":"ふ තිත යට කොටස් තුනක්. え තිතේ සිට පහළට එකට සම්බන්ධයි."}},{"chars":["ゆ","わ","を"],"tip":{"ja":"をは 上に よこ線が 1本 あります。わ・ゆには ありません。ゆは 中に むすびが あり、わは たて線から はじまって むすびが ありません。","en":"を has a horizontal bar across the top; わ and ゆ do not. ゆ has a loop inside, わ starts from an upright and has no loop.","si":"を උඩින් තිරස් ඉරක් තියෙනවා; わ සහ ゆ වලට නැහැ. ゆ ඇතුළේ වළල්ලක්, わ සිරස් ඉරකින් පටන් ගන්නවා, වළල්ලක් නැහැ."}},{"chars":["よ","ま","も"],"tip":{"ja":"よは たて線 1本に むすび。まは よこ線 2本に むすび。もは たて線が 左から 出て よこ線 2本です。","en":"よ is one upright with a loop. ま adds two crossbars. も has two crossbars but its upright starts on the left.","si":"よ එක සිරස් ඉරක් සහ වළල්ලක්. ま තිරස් ඉරි දෙකක් එකතු වෙනවා. も තිරස් ඉරි දෙකයි, ඒත් සිරස් ඉර වමෙන්."}},{"chars":["せ","さ","き"],"tip":{"ja":"せは たて線が 下で 右に まがります。さは 2かくで 下が はなれます。きは よこ線が 2本です。","en":"せ has an upright that turns right at the bottom. さ is two strokes with the lower part detached. き has two crossbars.","si":"せ වල සිරස් ඉර පහළින් දකුණට හැරෙනවා. さ ඉරි දෙකක්, පහළ කොටස වෙන්. き තිරස් ඉරි දෙකක්."}},{"chars":["ん","そ"],"tip":{"ja":"んは 左下から 右へ 1本で ながれます。そは 上に おれた 線が あり、2つの ぶぶんに 見えます。","en":"ん flows as one stroke from the lower left to the right. そ has a zig-zag at the top and reads as two parts.","si":"ん පහළ වමේ සිට දකුණට එක ඉරක්. そ උඩ නැමීමක් තියෙනවා, කොටස් දෙකක් වගේ."}},{"chars":["こ","に","た"],"tip":{"ja":"こは よこ線 2本だけ。にの 左は たて線 1本。たの 左は 「十」の 形です。","en":"こ is just two horizontal strokes. に has a single upright on the left. た has a cross shape on the left.","si":"こ තිරස් ඉරි දෙකක් විතරයි. に වම පැත්තේ එක සිරස් ඉරක්. た වම පැත්තේ කුරුසයක්."}},{"chars":["み","さ","き","ち"],"tip":{"ja":"みは 下に むすびが あります。さ・き・ちは むすびが ありません。よこ線が 2本なら き、1本で 左むきなら さ、右むきなら ちです。","en":"み ends in a loop; さ, き and ち do not. Two crossbars means き; one crossbar facing left is さ, facing right is ち.","si":"み අගට වළල්ලක්; さ, き, ち වලට නැහැ. තිරස් ඉරි දෙකක් නම් き; එකක් වමට නම් さ, දකුණට නම් ち."}},{"chars":["や","か","が"],"tip":{"ja":"かは 「力」に てんを つけた 形です。やは よこ線が 中を つらぬいて、右上に のびます。がは かに てんてんが ついた 形です。","en":"か is the shape 力 with a dot added. や has a stroke running through the middle and out to the upper right. が is か with the two marks.","si":"か කියන්නේ 力 හැඩයට තිතක් එකතු කළ එක. や මැදින් කැපෙන ඉරක් උඩ දකුණට යනවා. が කියන්නේ か ට සලකුණු දෙක එක්කලා."}},{"chars":["と","て","ど"],"tip":{"ja":"とは たて線に 右下から 1本 つきます。ては 上の よこ線から はじまります。どは とに てんてんが ついた 形です。","en":"と is an upright with a stroke joining from the lower right. て starts from a bar on top. ど is と with the two marks.","si":"と සිරස් ඉරකට පහළ දකුණින් ඉරක්. て උඩ ඉරකින් පටන් ගන්නවා. ど කියන්නේ と ට සලකුණු දෙක එක්කලා."}},{"chars":["の","ぬ","め"],"tip":{"ja":"のは 1かくで むすびが ありません。ぬは むすびが あります。めは むすびが なく、2かくです。","en":"の is one stroke with no loop. ぬ ends in a loop. め has no loop and is written in two strokes.","si":"の එක ඉරයි, වළල්ලක් නැහැ. ぬ අගට වළල්ලක්. め වළල්ලක් නැහැ, ඉරි දෙකයි."}},{"chars":["サ","セ","ヤ"],"tip":{"ja":"サは たて線が 2本 下に 出ます。セは 1本で 下が 右に まがります。ヤは 右上に ながい 線が のびます。","en":"サ has two uprights running below the bar. セ has one that turns right. ヤ has a long stroke to the upper right.","si":"サ ඉරෙන් පහළට සිරස් ඉරි දෙකක්. セ එකක්, දකුණට හැරෙනවා. ヤ උඩ දකුණට දිග ඉරක්."}},{"chars":["ラ","フ","ヲ"],"tip":{"ja":"ラは 上に みじかい よこ線が あります。フは 1かく だけ。ヲは よこ線が 2本 あります。","en":"ラ has a short bar on top. フ is a single stroke. ヲ has two horizontal bars.","si":"ラ උඩ කෙටි ඉරක්. フ එක ඉරයි. ヲ තිරස් ඉරි දෙකක්."}},{"chars":["レ","ル","ノ"],"tip":{"ja":"ノは 左下へ おりるだけ。レは 下で 右上に あがります。ルは レの 左に もう1本 あります。","en":"ノ only falls to the lower left. レ turns up to the right at the bottom. ル is レ with one more stroke on its left.","si":"ノ පහළ වමට විතරයි. レ පහළින් දකුණට උඩට. ル කියන්නේ レ ට වමෙන් තව එකක්."}},{"chars":["ト","カ","エ"],"tip":{"ja":"トは たて線に みじかい てんが 1つ。カは 右下に はらいが あります。エは よこ線が 上下に 2本です。","en":"ト is an upright with one short stroke. カ sweeps down to the right. エ has bars at both the top and the bottom.","si":"ト සිරස් ඉරක් සහ කෙටි එකක්. カ පහළ දකුණට ගලනවා. エ උඩ සහ පහළ ඉරි දෙකක්."}},{"chars":["ニ","ミ"],"tip":{"ja":"ニは よこ線 2本、ミは ななめの 線 3本です。ミは 右上から 左下へ 3かい 書きます。","en":"ニ is two horizontal strokes; ミ is three slanted ones written from the upper right to the lower left.","si":"ニ තිරස් ඉරි දෙකක්; ミ ඇල ඉරි තුනක්, උඩ දකුණේ සිට පහළ වමට."}},{"chars":["リ","ハ","ソ"],"tip":{"ja":"リは 2本とも たてに ながく、右が ながい。ハは 2本が ひらいて います。ソは てんと ながい 線の 組みあわせです。","en":"リ has two tall strokes with the right one longer. ハ opens outward. ソ is a dot plus one long stroke.","si":"リ උස ඉරි දෙකක්, දකුණ දිගයි. ハ පිටතට විවෘතයි. ソ තිතක් සහ දිග ඉරක්."}},{"chars":["イ","ト","ノ"],"tip":{"ja":"イは 左に みじかい てん、右に ながい はらい。トは たて線が まっすぐ 下に のびます。","en":"イ has a short stroke on the left and a long sweep on the right. ト has a straight upright running down.","si":"イ වමේ කෙටි ඉරක්, දකුණේ දිග ගැලීමක්. ト කෙළින් සිරස් ඉරක්."}},{"chars":["モ","ヨ","キ"],"tip":{"ja":"モは よこ線 2本に たて線が 下へ ぬけます。ヨは よこ線 3本で 左に とじます。キは よこ線 2本で たてが 中央です。","en":"モ has two bars with an upright running through to the bottom. ヨ has three bars closed on the left. キ has two bars with a centred upright.","si":"モ ඉරි දෙකක් සහ පහළට කැපෙන සිරස් ඉරක්. ヨ ඉරි තුනක්, වමෙන් වැසෙනවා. キ ඉරි දෙකක්, මැදින් සිරස් ඉරක්."}},{"chars":["も","し","つ"],"tip":{"ja":"もは よこ線が 2本 ある たて長の 形。しは よこ線が なく、たてに ながい 1本です。つは よこに ひろい 形です。","en":"も is tall with two crossbars. し has no crossbars — one tall stroke hooking right. つ is wide and flat.","si":"も උසයි, තිරස් ඉරි දෙකක්. し තිරස් ඉරි නැහැ — උස එක ඉරක්. つ පළලයි."}}],"rules":{"hyaku":{"ja":"3・6・8の あとは 音が かわります。300 さんびゃく、600 ろっぴゃく、800 はっぴゃく。ほかは そのままです。","en":"After 3, 6 and 8 the sound changes: 300 さんびゃく, 600 ろっぴゃく, 800 はっぴゃく. The rest are regular.","si":"3, 6, 8 පස්සේ ශබ්දය වෙනස් වෙනවා: 300 さんびゃく, 600 ろっぴゃく, 800 はっぴゃく. අනිත් ඒවා නීතිගතයි."},"sen":{"ja":"1000は 「せん」です。「いっせん」とは いいません。3000は さんぜん、8000は はっせん に なります。","en":"1000 on its own is せん, never いっせん. 3000 becomes さんぜん and 8000 becomes はっせん.","si":"1000 කියන්නේ せん, いっせん නෙවෙයි. 3000 さんぜん, 8000 はっせん."},"man":{"ja":"10000は かならず 「いちまん」です。「まん」だけとは いいません。","en":"10,000 is always いちまん. Japanese never says まん on its own here.","si":"10,000 හැම විටම いちまん. まん විතරක් කියන්නේ නැහැ."},"counter":{"ja":"1・6・8の あとは つまる 音（いっ・ろっ・はっ）に なり、3の あとは にごる ことが あります。1本 いっぽん、3本 さんぼん、6本 ろっぽん、8本 はっぽん。","en":"After 1, 6 and 8 the counter takes a small っ (いっ, ろっ, はっ), and after 3 it often voices. 1本 いっぽん, 3本 さんぼん, 6本 ろっぽん, 8本 はっぽん.","si":"1, 6, 8 පස්සේ කුඩා っ එනවා (いっ, ろっ, はっ), 3 පස්සේ බොහෝ විට නාද වෙනවා. 1本 いっぽん, 3本 さんぼん, 6本 ろっぽん, 8本 はっぽん."},"counterIrregular":{"ja":"この かぞえかたは 形が かわります。1人 ひとり、2人 ふたり、20歳 はたち、1日 ついたち。おぼえる しか ありません。","en":"This counter simply changes shape and has to be memorised: 1人 ひとり, 2人 ふたり, 20歳 はたち, 1日 ついたち.","si":"මේ ගණන් වචනය හැඩය වෙනස් කරනවා, කටපාඩම් කරන්න ඕනේ: 1人 ひとり, 2人 ふたり, 20歳 はたち, 1日 ついたち."},"hour":{"ja":"時こくで あてられない よみは 3つだけです。4時 よじ、7時 しちじ、9時 くじ。ほかは すうじの まま＋じ です。","en":"Only three hours are unpredictable: 4時 よじ, 7時 しちじ, 9時 くじ. Every other hour is just the number plus じ.","si":"අනුමාන කරන්න බැරි පැය තුනයි: 4時 よじ, 7時 しちじ, 9時 くじ. අනිත් හැම එකක්ම අංකය + じ."},"minute":{"ja":"「〜分」は 1・3・4・6・8・10の あとで ぷん に なります。ほかは ふん です。","en":"Minutes become ぷん after 1, 3, 4, 6, 8 and 10. Everywhere else it is ふん.","si":"විනාඩි 1, 3, 4, 6, 8, 10 පස්සේ ぷん වෙනවා. අනිත් තැන්වල ふん."},"half":{"ja":"30分は ふつう 「半」と いいます。「さんじゅっぷん」も まちがいでは ありませんが、あまり つかいません。","en":"Thirty minutes past is normally said as 半. さんじゅっぷん is not wrong, but it is rarely used.","si":"විනාඩි 30 සාමාන්‍යයෙන් 半. さんじゅっぷん වැරදි නැහැ, ඒත් කලාතුරකින් පාවිච්චි වෙනවා."}}},"i18n":{"en":{"mastery":"Mastered","lblMode":"Question","lblScript":"Script","lblSet":"Range","lblLen":"Session","m_learn":"Learn","m_gojuon":"Fill the chart","m_k2r":"Read it","m_r2k":"Pick the kana","m_h2k":"Hiragana ⇄ Katakana","m_listen":"Listen","m_type":"Type it","m_spell":"Spell it","m_special":"っ ー ん","m_word":"Words","sc_h":"Hiragana","sc_k":"Katakana","sc_mix":"Both","st_sei":"Basic","st_daku":"Dakuten","st_han":"Handakuten","st_you":"Yoon","len20":"20 questions","len50":"50 questions","lenInf":"
