<!DOCTYPE html>

<body>

<header>
  <div class="hbar">
    <a class="mark" href="index.html">かな<small>Takane-shiki Kana Study</small></a>
    <nav class="nav">
      <a href="index.html" data-nav data-t="navHome" class="si-swap">Home</a>
      <a href="guide.html" data-nav data-t="navGuide" class="si-swap">Rules</a>
      <a href="chart.html" data-nav data-t="navChart" class="si-swap">Chart</a>

    </nav>
    <div class="langs" id="langs" role="group" aria-label="Language">

      <button type="button" data-lang="ja" aria-pressed="false">日本語</button>

        <span id="mLabel" data-t="mastery" class="si-swap">Mastered</span>

    </div>
    <div class="goal" id="goal"><span class="ring"></span><span class="txt"></span></div>

<div class="wrap">

    <h1 data-t="homeLead" class="si-swap">Learn to read hiragana and katakana.</h1>
    <p data-t="homeSub" class="si-swap"></p>
  </div>

  <div class="cards">
    <a class="hcard" href="guide.html">
      <div class="n">1</div>
      <h2 data-t="cGuideT" class="si-swap"></h2>
      <p data-t="cGuideD" class="si-swap"></p>
      <span class="go" data-t="goto"></span>
    </a>
    <a class="hcard" href="drill.html">
      <div class="n">2</div>
      <h2 data-t="cDrillT" class="si-swap"></h2>
      <p data-t="cDrillD" class="si-swap"></p>
      <span class="go" data-t="goto"></span>
    </a>
    <a class="hcard" href="chart.html">
      <div class="n">3</div>
      <h2 data-t="cChartT" class="si-swap"></h2>
      <p data-t="cChartD" class="si-swap"></p>
      <span class="go" data-t="goto"></span>
    </a>
    <a class="hcard" href="numbers.html">
      <div class="n">4</div>
      <h2 data-t="cNumT" class="si-swap"></h2>
      <p data-t="cNumD" class="si-swap"></p>
      <span class="go" data-t="goto"></span>
    </a>
  </div>

  <footer>
    <p id="f1" data-t="footKeys" class="si-swap"></p>
    <p id="f2" data-t="footSinhala" class="si-swap"></p>

};
